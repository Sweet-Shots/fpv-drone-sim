<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acro FPV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --ink: #f2ece2;          /* paper-white, warm */
    --ink-dim: #8c9198;
    --ink-faint: #565c63;
    --ground: #0b0c0e;       /* near-black, slight blue */
    --ground-2: #121417;
    --flag: #ff5c16;         /* safety orange: pylons, course flags */
    --flag-deep: #c33d08;
    --live: #7dffb0;         /* telemetry green */
    --alert: #ff4d4d;
    --amber: #ffb020;
    --rule: rgba(242, 236, 226, 0.14);
    --rule-strong: rgba(242, 236, 226, 0.32);
    --display: 'Saira Condensed', 'Arial Narrow', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    /* PlayStation face-button glyphs are not in every mono face. */
    --sym: 'IBM Plex Mono', 'Segoe UI Symbol', 'Apple Symbols', 'Noto Sans Symbols 2', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  canvas { display: block; }
  #scene, #hud { position: fixed; inset: 0; width: 100%; height: 100%; }
  #hud { pointer-events: none; }

  /* ================= in-flight: OSD text only, no panels ================= */
  #hint {
    position: fixed;
    left: 18px;
    bottom: 16px;
    max-width: min(560px, calc(100vw - 36px));
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.9;
    color: rgba(238, 242, 238, 0.82);
    text-shadow: 0 0 3px #000, 0 1px 2px #000;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  #hint b {
    font-family: var(--sym);
    display: inline-block;
    min-width: 0;
    padding: 0 5px;
    margin-right: 5px;
    font-weight: 600;
    color: #fff;
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.28);
  }
  #hint span { margin-right: 16px; white-space: nowrap; }
  #hint.gone { opacity: 0; }

  /* ---- touch controls ---- */
  #touch { position: fixed; inset: 0; pointer-events: none; z-index: 4; }
  #touch[hidden] { display: none !important; }
  #touch .pad {
    position: absolute;
    bottom: max(14px, env(safe-area-inset-bottom, 0px));
    width: min(34vw, 168px);
    height: min(34vw, 168px);
    pointer-events: auto;
    touch-action: none;
    border-radius: 50%;
  }
  #touch #padL { left: max(14px, env(safe-area-inset-left, 0px)); }
  #touch #padR { right: max(14px, env(safe-area-inset-right, 0px)); }
  #touch .ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1px solid rgba(238, 242, 238, 0.30);
    background: rgba(8, 10, 12, 0.28);
  }
  #touch .pad i {
    position: absolute;
    left: 50%; top: 50%;
    width: 34%; height: 34%;
    margin: -17% 0 0 -17%;
    border-radius: 50%;
    background: rgba(238, 242, 238, 0.32);
    border: 1px solid rgba(238, 242, 238, 0.55);
    transition: background 0.15s;
  }
  #touch .pad.on i { background: rgba(255, 92, 22, 0.55); border-color: var(--flag); }
  #touch .pad em {
    position: absolute;
    left: 0; right: 0; top: -18px;
    text-align: center;
    font-family: var(--mono);
    font-size: 9.5px;
    font-style: normal;
    letter-spacing: 0.16em;
    color: rgba(238, 242, 238, 0.5);
  }
  /* The throttle pad is a slider, not a self-centring stick: a mark shows
     where the throttle is sitting when your thumb is off it. */
  #touch #padL .ring::after {
    content: '';
    position: absolute;
    left: 8%; right: 8%;
    top: var(--thr, 50%);
    height: 2px;
    background: rgba(255, 176, 32, 0.85);
  }
  #touch .tbtns {
    position: absolute;
    left: 50%;
    bottom: max(20px, env(safe-area-inset-bottom, 0px));
    transform: translateX(-50%);
    display: flex;
    gap: 10px;
    pointer-events: auto;
  }
  #touch .tbtn {
    width: 54px; height: 42px;
    border: 1px solid rgba(238, 242, 238, 0.35);
    background: rgba(8, 10, 12, 0.55);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.1em;
    touch-action: manipulation;
  }
  #touch .tbtn:active { background: rgba(255, 92, 22, 0.35); }
  #touch .tbtn.armed { color: var(--alert); border-color: var(--alert); }

  #toast {
    position: fixed;
    left: 50%;
    top: 26%;
    transform: translate(-50%, -50%);
    font-family: var(--display);
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-align: center;
    opacity: 0;
    transition: opacity 0.2s;
    text-shadow: 0 2px 12px #000, 0 0 3px #000;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  /* ================= overlays: menu + pause ================= */
  .screen {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    background: var(--ground);
    overflow: auto;
    overscroll-behavior: contain;
  }
  .screen[hidden] { display: none; }
  #pause { background: rgba(11, 12, 14, 0.93); }

  /* grain + a ghosted gate glyph: the room this thing lives in */
  .screen::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 80% 60% at 78% 42%, rgba(255, 92, 22, 0.07), transparent 70%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.014) 0 1px, transparent 1px 3px);
  }
  #gateglyph {
    position: absolute;
    right: -6%;
    top: 50%;
    transform: translateY(-50%);
    width: min(52vw, 620px);
    opacity: 0.075;
    pointer-events: none;
  }

  .wrap {
    position: relative;
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding-block: clamp(20px, 4vh, 46px);
    padding-inline: 20px;
    display: flex;
    flex-direction: column;
    gap: clamp(16px, 3vh, 30px);
    flex: 1;
  }

  /* --- masthead --- */
  .mast { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .lockup { display: flex; align-items: baseline; gap: 10px; }
  .lockup h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(38px, 7vw, 76px);
    line-height: 0.86;
    letter-spacing: -0.015em;
    text-transform: uppercase;
  }
  .lockup h1 em {
    font-style: normal;
    color: transparent;
    -webkit-text-stroke: 1.5px var(--flag);
    text-stroke: 1.5px var(--flag);
  }
  .mast .meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-dim);
    text-align: right;
    line-height: 1.7;
    letter-spacing: 0.04em;
  }
  .mast .meta b { color: var(--ink); font-weight: 500; }

  .rule { height: 1px; background: var(--rule); }
  .rule.strong { background: var(--rule-strong); }

  /* ============ radial dial menu, with the demo flight behind ============
     The page is one canvas: the menu owns the left, and the right stays
     clear so the showcase flight reads as the background it is. */
  #menu { background: none; }
  .menu-scrim {
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      linear-gradient(100deg, var(--ground) 0%, var(--ground) 26%,
        rgba(11,12,14,0.92) 40%, rgba(11,12,14,0.55) 56%, rgba(11,12,14,0.12) 72%, rgba(11,12,14,0) 88%);
  }
  .menu-left {
    position: relative;
    z-index: 1;
    /* Fixed rows: the tray cannot push the dial around as descriptions change
       length, which is what made the arc breathe as you moved through it. */
    display: grid;
    grid-template-rows: auto minmax(0, 1fr) auto;
    height: 100%;
    width: min(56%, 620px);
    min-width: 0;
    padding: clamp(18px, 3.5vh, 40px) 0 clamp(16px, 3vh, 32px) clamp(20px, 4vw, 54px);
  }
  .menu-left .mast { display: block; }
  .menu-left .meta { text-align: left; margin-top: 8px; }

  .dial {
    position: relative;
    flex: 1;
    min-height: 260px;
    margin-left: -6px;
  }
  .dial-arc { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }

  .spoke {
    position: absolute;
    left: 0; top: 0;
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 4px 14px 4px 12px;
    border: 0;
    border-left: 2px solid transparent;
    background: none;
    color: var(--ink-dim);
    font: inherit;
    text-align: left;
    white-space: nowrap;
    cursor: pointer;
    transform-origin: left center;
    transition: transform 0.22s cubic-bezier(.22,.9,.3,1), opacity 0.22s, color 0.2s;
  }
  .spoke[hidden] { display: none !important; }
  .spoke .lbl {
    font-family: var(--mono);
    font-size: 10.5px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: var(--ink-faint);
    min-width: 104px;
  }
  .spoke .val {
    font-family: var(--display);
    font-weight: 600;
    font-size: 19px;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    line-height: 1;
  }
  .spoke[data-focus="1"] {
    color: var(--ink);
    border-left-color: var(--flag);
    background: linear-gradient(90deg, rgba(255,92,22,0.16), rgba(255,92,22,0));
  }
  .spoke[data-focus="1"] .lbl { color: var(--flag); }
  .spoke[data-focus="1"] .val { font-size: 27px; color: var(--ink); }
  .spoke[data-focus="1"] .val::after {
    content: ' ‹ ›';
    font-family: var(--mono);
    font-size: 13px;
    color: var(--ink-faint);
    letter-spacing: -0.04em;
  }
  .spoke.launch .val { color: var(--ink-dim); }
  .spoke.launch[data-focus="1"] .val { color: var(--flag); }
  .spoke.launch[data-focus="1"] .val::after { content: ''; }
  .spoke:focus-visible { outline: 1px solid var(--flag); outline-offset: -1px; }

  .tray {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding-right: 18px;
    height: 196px;          /* fixed: the record exists only on one page */
    overflow: hidden;
  }
  .tray .desc {
    font-family: var(--mono);
    font-size: 12px;
    line-height: 1.7;
    color: var(--ink-dim);
    max-width: 54ch;
    height: 5.1em;          /* fixed, so the dial above never moves */
    overflow: hidden;
  }

  .pagetitle {
    margin-top: 12px;
    font-family: var(--display);
    font-size: 15px;
    font-weight: 700;
    letter-spacing: 0.32em;
    text-transform: uppercase;
    color: var(--flag);
  }

  /* --- Help / Credits pages --- */
  #pagecontent {
    position: absolute;
    inset: 0;
    padding-right: 18px;
    overflow: auto;
  }
  #pagecontent[hidden] { display: none; }
  .helpgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 26px; }
  .helpcol h3 {
    margin: 0 0 8px;
    font-family: var(--mono);
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--flag);
    border-bottom: 1px solid var(--rule);
    padding-bottom: 6px;
  }
  .helpcol dl { display: grid; grid-template-columns: auto 1fr; gap: 3px 10px; margin: 0; }
  .helpcol dt {
    font-family: var(--sym);
    font-size: 11px;
    color: var(--ink);
    white-space: nowrap;
  }
  .helpcol dd { margin: 0; font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }
  .helpnote {
    grid-column: 1 / -1;
    font-family: var(--mono);
    font-size: 11px;
    line-height: 1.7;
    color: var(--ink-faint);
    border-top: 1px solid var(--rule);
    padding-top: 8px;
  }
  .credits {
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    gap: 0;
  }
  .credits p { margin: 0; }
  .credits .ctag {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.26em;
    text-transform: uppercase;
    color: var(--ink-faint);
    margin-bottom: 10px;
  }
  .credits .cname {
    font-family: var(--display);
    font-size: clamp(38px, 5.4vw, 62px);
    font-weight: 700;
    line-height: 0.94;
    letter-spacing: -0.01em;
    color: var(--ink);
  }
  .credits .cfor {
    font-family: var(--display);
    font-size: clamp(20px, 2.4vw, 28px);
    font-weight: 500;
    letter-spacing: 0.02em;
    color: var(--ink-dim);
    margin-top: 8px;
  }
  .credits .cfor b { color: var(--flag); font-weight: 700; }
  .credits .crule { width: 56px; height: 2px; background: var(--flag); margin: 26px 0 18px; }
  .credits .clove {
    font-family: var(--mono);
    font-size: 12px;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-dim);
  }
  .tray .desc b { color: var(--ink); font-weight: 500; }
  .trayfoot { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; min-height: 54px; }

  /* --- three-column selection board (pause screen still uses .opt/.setrow) --- */
  .board {
    display: grid;
    grid-template-columns: 1.15fr 1fr 1fr;
    gap: 0;
    border-top: 1px solid var(--rule-strong);
    border-bottom: 1px solid var(--rule-strong);
  }
  .col { padding: 14px 18px 16px; border-right: 1px solid var(--rule); }
  .col:last-child { border-right: 0; }
  .col > h2 {
    margin: 0 0 12px;
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .col.focused > h2 { color: var(--flag); }

  .opt {
    display: grid;
    grid-template-columns: 34px 1fr;
    align-items: baseline;
    gap: 10px;
    width: 100%;
    padding: 7px 8px 7px 10px;
    border: 0;
    border-left: 2px solid transparent;
    background: none;
    color: var(--ink-dim);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .opt .code {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
  }
  .opt .name {
    font-family: var(--display);
    font-weight: 600;
    font-size: 19px;
    letter-spacing: 0.015em;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .opt .sub {
    grid-column: 2;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    line-height: 1.5;
    margin-top: 3px;
    display: none;
  }
  .opt:hover { color: var(--ink); }
  .opt[aria-selected="true"] { color: var(--ink); border-left-color: var(--flag); background: rgba(255, 92, 22, 0.05); }
  .opt[aria-selected="true"] .code { color: var(--flag); }
  .opt[aria-selected="true"] .sub { display: block; }
  .opt:focus-visible { outline: 1px solid var(--flag); outline-offset: -1px; }

  /* --- setup rows (toggles / cycles) --- */
  .setrow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    padding: 8px 8px 8px 10px;
    border: 0;
    border-left: 2px solid transparent;
    background: none;
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    text-align: left;
  }
  .setrow .v {
    font-weight: 600;
    color: var(--ink);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .setrow[aria-selected="true"] { color: var(--ink); border-left-color: var(--flag); background: rgba(255, 92, 22, 0.05); }
  .setrow[aria-selected="true"] .v { color: var(--flag); }
  .setrow:focus-visible { outline: 1px solid var(--flag); outline-offset: -1px; }
  .setrow .v::before { content: '‹ '; color: var(--ink-faint); }
  .setrow .v::after { content: ' ›'; color: var(--ink-faint); }

  /* --- briefing strip --- */
  .brief { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: start; flex: 1; }
  .brief .desc {
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.75;
    color: var(--ink-dim);
    max-width: 62ch;
  }
  .brief .desc b { color: var(--ink); font-weight: 500; }
  .record {
    font-family: var(--mono);
    font-size: 10.5px;
    color: var(--ink-faint);
    letter-spacing: 0.14em;
    line-height: 1.6;
    white-space: nowrap;
    text-transform: uppercase;
  }
  .record .t {
    display: block;
    font-family: var(--display);
    font-size: 26px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--amber);
    font-variant-numeric: tabular-nums;
  }

  /* --- footer: device-specific bindings only --- */
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .binds { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }
  .binds span { white-space: nowrap; }
  .binds b {
    font-family: var(--sym);
    display: inline-block;
    padding: 1px 6px;
    margin-right: 6px;
    font-weight: 500;
    color: var(--ink);
    border: 1px solid var(--rule-strong);
  }
  .device {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
    white-space: nowrap;
  }
  .device .dot { width: 7px; height: 7px; background: var(--live); box-shadow: 0 0 8px var(--live); }
  .device.pad .dot { background: #64b5ff; box-shadow: 0 0 8px #64b5ff; }
  .device.touch .dot { background: #ffb020; box-shadow: 0 0 8px #ffb020; }
  .device b { color: var(--ink); font-weight: 600; }

  .go {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 11px 26px;
    border: 0;
    background: var(--flag);
    color: #140800;
    font-family: var(--display);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .go:hover { background: #ff7738; }
  .go:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .go kbd {
    font-family: var(--sym);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0;
    padding: 2px 6px;
    background: rgba(0, 0, 0, 0.22);
  }

  /* --- pause --- */
  #pause .wrap { max-width: 560px; justify-content: center; }
  #pause h2.title {
    margin: 0;
    font-family: var(--display);
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  #pause .sub { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); }
  .menulist { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
  .menulist .setrow, .menulist .opt { border-bottom: 1px solid var(--rule); }

  /* --- boot --- */
  #boot {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center;
    background: var(--ground); text-align: center; padding: 24px;
  }
  #boot .lockup h1 { font-size: clamp(34px, 6vw, 58px); }
  #boot p { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--ink-dim); max-width: 52ch; line-height: 1.7; }
  #boot .bar { width: min(280px, 60vw); height: 2px; background: var(--rule); overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 38%; background: var(--flag); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(360%); } }
  #boot[hidden] { display: none; }
  .err { color: var(--alert) !important; }

  @media (prefers-reduced-motion: reduce) {
    #boot .bar i { animation: none; width: 100%; }
    * { transition-duration: 0.01ms !important; }
  }

  @media (max-width: 860px) {
    .menu-left { width: 100%; padding-inline: 18px; }
    .menu-scrim { background: linear-gradient(100deg, var(--ground) 0%, rgba(11,12,14,0.93) 55%, rgba(11,12,14,0.72) 100%); }
    .tray { height: 168px; }
    .spoke[hidden] { display: none !important; }
  .spoke .lbl { min-width: 78px; font-size: 9.5px; }
    .spoke .val { font-size: 16px; }
    .spoke[data-focus="1"] .val { font-size: 21px; }
    .board { grid-template-columns: 1fr; }
    .col { border-right: 0; border-bottom: 1px solid var(--rule); }
    .col:last-child { border-bottom: 0; }
    .brief { grid-template-columns: 1fr; }
    .record { text-align: left; }
    #gateglyph { display: none; }
    #hint { display: none; }
  }
</style>
</head>

<script>
/* ------------------------------------------------------------------ *
 * Three.js: cdnjs first, jsDelivr as fallback.
 * ------------------------------------------------------------------ */
(function loadThree() {
  var sources = [
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'
  ];
  var msg = document.getElementById('bootmsg');
  var i = 0;
  (function next() {
    if (i >= sources.length) {
      msg.className = 'err';
      msg.textContent = 'Could not load the 3D renderer from any CDN. Check your connection and reload.';
      return;
    }
    var s = document.createElement('script');
    s.src = sources[i++];
    s.onload = function () {
      if (!window.THREE) { next(); return; }
      try { start(); } catch (e) {
        msg.className = 'err';
        msg.textContent = 'Startup failed: ' + e.message;
        throw e;
      }
    };
    s.onerror = next;
    document.head.appendChild(s);
  })();
})();

/* ================================================================== *
 * FLIGHT MODEL — a real 5" freestyle quad in Betaflight acro mode
 *
 * Reference airframe every number below describes:
 *   220 mm wheelbase X frame, 2207/2450KV motors, 5x4.3x3 tri-blade
 *   props, 4S 1300 mAh Li-Po, ~650 g all-up weight. These are physical
 *   quantities with units, not feel knobs — if one of them is wrong it
 *   is wrong about a real quadcopter and can be argued about as such.
 * ================================================================== */
var QUAD = {
  massKg: 0.650,              // kg      all-up weight with pack, no action cam
  gravity: 9.81,              // m/s^2

  /* --- propulsion -------------------------------------------------- */
  thrustPerMotorN: 10.30,     // N       static thrust per motor at 100% and 16.8 V
                              //         = 1050 gf.  4 x 1050 gf / 650 g = 6.46:1 bench
  thrustRefV: 16.8,           // V       pack voltage the figure above is quoted at
  thrustExp: 1.5,             // -       T ~ cmd^1.5.  Loaded RPM ~ cmd^0.75 and
                              //         T ~ RPM^2, which is the usual fit to a
                              //         motor test-stand thrust-vs-throttle table.
  motorIdle: 0.055,           // -       Betaflight motor_idle 5.5%: armed props
                              //         never stop, and the stick maps onto [idle,1]
  spoolUpTau: 0.022,          // s       rotor RPM step response, rising (DShot600)
  spoolDownTau: 0.030,        // s       falling — only prop drag decelerates it
  armM: 0.0778,               // m       motor offset from CG on body X and Z
                              //         (220 mm motor-to-motor diagonal / 2 / sqrt2)
  propTorqueArm: 0.0100,      // m       prop drag torque per newton of thrust,
                              //         = (Cq/Ct)*D for a 5" tri-blade. This is the
                              //         ONLY source of yaw torque, hence weak yaw.
  propRadiusM: 0.0635,        // m       5" prop
  pitchSpeedMax: 45.0,        // m/s     geometric pitch speed at 100% throttle:
                              //         4.3 in of pitch at ~25 000 rpm. Thrust falls
                              //         to zero as axial inflow approaches this.
  inducedVelHover: 7.2,       // m/s     momentum-theory induced velocity per rotor
                              //         at hover: sqrt(T / (2 rho A)). Sets where
                              //         vortex-ring state / propwash lives.

  /* --- inertia, kg m^2 (about the CG, body axes) -------------------- */
  Iroll: 0.0032,              // about body Z
  Ipitch: 0.0040,             // about body X — stack and pack are longer fore/aft
  Iyaw: 0.0062,               // about body Y

  /* --- aerodynamics ------------------------------------------------- */
  rho: 1.225,                 // kg/m^3  ISA sea-level air density
  cdaLateral: 0.012,          // m^2     Cd*A side-on   (body X)
  cdaAxial:  0.055,           // m^2     Cd*A belly-on  (body Y) — four spinning prop
                              //         discs plus the plate; this is the big one,
                              //         and it is why a flat fall is slow and a
                              //         nose-down dive is not.
  cdaLong:   0.014,           // m^2     Cd*A nose-on   (body Z) — frame edge, cam, arms
  rotDampBody: 0.00150,       // N m per rad/s   airframe + windmilling props
  rotDampProp: 0.00600,       // N m per rad/s   extra at 100% motor. Derived, not
                              //         guessed: rolling at w moves each disc
                              //         vertically at w*arm, which changes its
                              //         inflow and so its thrust by -T/Vpitch per
                              //         m/s. Summed over four motors that is
                              //         4*(T/Vpitch)*arm^2 = 5.5e-3 N m per rad/s.
  propwashTorque: 0.035       // N m     peak oscillating disturbance in full VRS
};

/* Flight-controller constants. The rate loop below is a P+D controller on
 * gyro rate error whose output is a Betaflight motor mix — not a lag toward
 * the commanded rate — so authority is whatever the four motors can actually
 * produce at the current throttle. Gains are stated as the closed-loop
 * response they buy, because that is the auditable quantity: a well-tuned
 * 5" quad reaches a commanded roll rate in roughly 50 ms, pitch a little
 * slower, yaw two to three times slower again. */
/* ================================================================== *
 * AIRFRAMES
 * Each one is a complete set of the constants the model already runs on,
 * so swapping aircraft is data, not code. Figures are the usual published
 * ones for each class — bench thrust per motor, all-up weight, pack, prop
 * diameter — and everything else (inertia, drag area, prop damping) is
 * scaled from those by the same relations the 5" was derived with.
 * ================================================================== */
var AIRFRAMES = [
  { id: 'five', name: '5″ Freestyle', code: 'A1', modelScale: 1.00, groundY: 0.13, camTilt: 22, ducted: false,
    desc: 'The default racing and freestyle quad. 650 g, 4S, 6.5:1 thrust. Everything else here is measured against it.',
    quad: { massKg: 0.650, thrustPerMotorN: 10.30, thrustRefV: 16.8, thrustExp: 1.5, motorIdle: 0.055,
      spoolUpTau: 0.022, spoolDownTau: 0.030, armM: 0.0778, propTorqueArm: 0.0100, propRadiusM: 0.0635,
      pitchSpeedMax: 45.0, inducedVelHover: 7.2, Iroll: 0.0032, Ipitch: 0.0040, Iyaw: 0.0062,
      cdaLateral: 0.012, cdaAxial: 0.055, cdaLong: 0.014,
      rotDampBody: 0.00150, rotDampProp: 0.00600, propwashTorque: 0.035 },

  { id: 'whoop', name: 'Tinywhoop', code: 'A2', modelScale: 0.26, groundY: 0.022, camTilt: 25, ducted: true,
    desc: '65 mm ducted, 35 g, 2S. Almost no inertia, so it stops the instant you ask — and almost no speed either. Bounces off walls.',
    quad: { massKg: 0.035, thrustPerMotorN: 0.300, thrustRefV: 8.4, thrustExp: 1.5, motorIdle: 0.070,
      spoolUpTau: 0.012, spoolDownTau: 0.018, armM: 0.0230, propTorqueArm: 0.0024, propRadiusM: 0.0155,
      pitchSpeedMax: 14.0, inducedVelHover: 5.0, Iroll: 0.0000150, Ipitch: 0.0000180, Iyaw: 0.0000280,
      cdaLateral: 0.0025, cdaAxial: 0.0050, cdaLong: 0.0022,
      rotDampBody: 0.0000050, rotDampProp: 0.0000450, propwashTorque: 0.0004 },
    fc: { roll: 0.014, pitch: 0.016, yaw: 0.030 },
    battery: { cells: 2, full: 4.20, empty: 3.40, capacity: 450, rPack: 0.090, maxAmps: 14, idleAmps: 0.25, currentExp: 1.8 } },

  { id: 'cine', name: 'Cinewhoop', code: 'A3', modelScale: 0.62, groundY: 0.09, camTilt: 12, ducted: true,
    desc: '3″ ducted, 550 g, 4S. Heavy and draggy on purpose: it flies smooth lines and refuses to be twitchy.',
    quad: { massKg: 0.550, thrustPerMotorN: 5.90, thrustRefV: 16.8, thrustExp: 1.5, motorIdle: 0.060,
      spoolUpTau: 0.026, spoolDownTau: 0.034, armM: 0.0550, propTorqueArm: 0.0060, propRadiusM: 0.0380,
      pitchSpeedMax: 26.0, inducedVelHover: 6.5, Iroll: 0.00135, Ipitch: 0.00165, Iyaw: 0.00260,
      cdaLateral: 0.016, cdaAxial: 0.029, cdaLong: 0.014,
      rotDampBody: 0.00250, rotDampProp: 0.00270, propwashTorque: 0.020 },
    fc: { roll: 0.030, pitch: 0.034, yaw: 0.050 },
    battery: { cells: 4, full: 4.20, empty: 3.40, capacity: 1100, rPack: 0.022, maxAmps: 60, idleAmps: 0.8, currentExp: 1.8 } },

  { id: 'seven', name: '7″ Long range', code: 'A4', modelScale: 1.42, groundY: 0.17, camTilt: 20, ducted: false,
    desc: '1.15 kg on 6S. Carries its momentum into every corner and takes a moment to answer — but it will fly for ten minutes.',
    quad: { massKg: 1.150, thrustPerMotorN: 13.70, thrustRefV: 25.2, thrustExp: 1.5, motorIdle: 0.050,
      spoolUpTau: 0.035, spoolDownTau: 0.045, armM: 0.1050, propTorqueArm: 0.0140, propRadiusM: 0.0890,
      pitchSpeedMax: 52.0, inducedVelHover: 8.5, Iroll: 0.0103, Ipitch: 0.0125, Iyaw: 0.0190,
      cdaLateral: 0.024, cdaAxial: 0.109, cdaLong: 0.028,
      rotDampBody: 0.00400, rotDampProp: 0.01160, propwashTorque: 0.060 },
    fc: { roll: 0.035, pitch: 0.040, yaw: 0.060 },
    battery: { cells: 6, full: 4.20, empty: 3.40, capacity: 3000, rPack: 0.012, maxAmps: 90, idleAmps: 1.2, currentExp: 1.8 } }
];
function airframeById(id) {
  for (var i = 0; i < AIRFRAMES.length; i++) if (AIRFRAMES[i].id === id) return AIRFRAMES[i];
  return AIRFRAMES[0];
}

var FC = {
  tau: { roll: 0.022, pitch: 0.026, yaw: 0.045 },  // s   closed-loop rate time constants
  dTime: 0.015,               // s   D/P ratio expressed as a time
  iTime: 0.60,                // s   I/P ratio expressed as a time
  iLimit: 0.12,               // -   I-term clamp, fraction of motor range
  pidSumLimit: 0.50,          // -   Betaflight pidsum_limit     500/1000
  pidSumLimitYaw: 0.40,       // -   Betaflight pidsum_limit_yaw 400/1000
  gainThrottleRef: 0.30,      // -   motor command the gains are tuned at (hover)
  airmodeShiftThrottle: 0.50, // -   above this stick Betaflight shifts throttle to
                              //     fit the mix even with AIR MODE switched off
  minCheck: 0.05,             // -   Betaflight min_check (1050 of 1000-2000 us):
                              //     below this the stick counts as "down"
  gyroLimit: 2000 * Math.PI / 180  // rad/s  the gyro's full scale. Spin faster
                              //     than this and the FC is flying on a clipped
                              //     reading — ICM/MPU parts default to +-2000 dps.
};

var CFG = {
  deadzone: 0.09,
  gravity: 9.81,
  throttleRampUp: 1.15,
  throttleRampDown: 1.35,
  groundY: 0.13,              // m     body centre height sitting on its feet
  crashSpeed: 8.0,            // m/s   impact that ends the flight. A 5" quad into a
                              //       hard object at 8 m/s breaks a prop or an arm.
  bounce: 0.22,               // -     coefficient of restitution, carbon/plastic
  frictionMu: 0.65,           // -     Coulomb friction, skids/feet on grass or concrete
  camTilt: 22 * Math.PI / 180,
  fpvFov: 100,
  chaseFov: 74,
  losFov: 42,
  /* 4S 1300 mAh Li-Po. Full 4.20 V/cell, 3.30 V/cell under load is "land now".
   * Draw is modelled electrically and the pack's internal resistance sags it,
   * which costs RPM and therefore thrust — a fresh pack really does punch out
   * harder than a half-used one. */
  battery: {
    cells: 4,
    full: 4.20,               // V/cell  resting, fully charged
    empty: 3.40,              // V/cell  resting, empty
    capacity: 1300,           // mAh
    rPack: 0.016,             // ohm     whole-pack internal resistance + wiring
    maxAmps: 105,             // A       draw at 100% on all four motors
    idleAmps: 0.9,            // A       FC, VTX, RX, motors at idle
    currentExp: 1.8           // -       I ~ cmd^1.8 (fits published motor tables)
  }
};

/* Rate profiles, expressed in real Betaflight "Betaflight rates" terms —
 * RC Rate, Super Rate and RC Expo per axis — and run through the firmware's
 * own formula in bfRate(). Switchable rate profiles are a genuine feature of
 * every real quad, so all three stay. Peak rates: 260/420/700 deg/s in roll. */
var RATE_PROFILES = [
  { id: 'cruise', name: 'Cruise', code: 'R1',
    rc:   { pitch: 0.80, roll: 0.80, yaw: 0.80 },
    sup:  { pitch: 0.333, roll: 0.385, yaw: 0.059 },
    expo: { pitch: 0.10, roll: 0.10, yaw: 0.05 },
    smooth: 0.11,
    desc: 'Gentle. Rates a trainer quad would ship with.' },
  { id: 'sport', name: 'Sport', code: 'R2',
    rc:   { pitch: 1.00, roll: 1.00, yaw: 1.00 },
    sup:  { pitch: 0.474, roll: 0.524, yaw: 0.167 },
    expo: { pitch: 0.18, roll: 0.18, yaw: 0.12 },
    smooth: 0.075,
    desc: 'Quick but recoverable. Start here.' },
  { id: 'acro', name: 'Acro', code: 'R3',
    rc:   { pitch: 1.15, roll: 1.20, yaw: 1.10 },
    sup:  { pitch: 0.629, roll: 0.657, yaw: 0.421 },
    expo: { pitch: 0.25, roll: 0.25, yaw: 0.15 },
    smooth: 0.055,
    desc: 'Real freestyle rates. Two rolls a second. Unforgiving.' }
];

/* Betaflight applyBetaflightRates(), fc/rc.c — expo blend first, then
 * RC Rate, then the Super Rate expansion at the stick ends. Returns deg/s. */
function bfRate(x, rcRate, superRate, expo) {
  if (x > 1) x = 1; else if (x < -1) x = -1;
  var a = x < 0 ? -x : x;
  if (expo) x = x * (a * a * a) * expo + x * (1 - expo);
  var r = 200 * rcRate * x;
  if (superRate) {
    var f = 1 - a * superRate;
    r *= 1 / (f < 0.01 ? 0.01 : f > 1 ? 1 : f);
  }
  return r;
}

/* The three idle-authority settings, worst to best, in the order the menu
 * cycles them. See Input.idleMode for what each one is. */
var IDLE_MODES = ['motorstop', 'idle', 'airmode'];
var IDLE_MODE_NAMES = { motorstop: 'Motor stop', idle: 'Idle floor', airmode: 'Air mode' };
function idleModeName() { return IDLE_MODE_NAMES[Input.idleMode]; }
function cycleIdleMode(d) {
  var i = IDLE_MODES.indexOf(Input.idleMode);
  d = d || 1;
  Input.idleMode = IDLE_MODES[(i + d + IDLE_MODES.length) % IDLE_MODES.length];
  Store.data.idleMode = Input.idleMode;
  Store.save();
}

/* Peak rate per axis, for the menus. */
RATE_PROFILES.forEach(function (p) {
  p.rate = { pitch: Math.round(bfRate(1, p.rc.pitch, p.sup.pitch, p.expo.pitch)),
             roll:  Math.round(bfRate(1, p.rc.roll,  p.sup.roll,  p.expo.roll)),
             yaw:   Math.round(bfRate(1, p.rc.yaw,   p.sup.yaw,   p.expo.yaw)) };
});

/* Betaflight flies one of these at a time, selected from an AUX switch.
 * ACRO is rate mode: sticks command rotation and nothing levels you.
 * ANGLE is self-levelling: stick deflection is a target LEAN ANGLE and the
 * quad returns to level when you let go. CAMERA is what a DJI-style camera
 * drone does — angle mode plus altitude hold and velocity braking, so
 * releasing the sticks parks it in the air. */
var FLIGHT_MODES = [
  { id: 'acro', name: 'Acro', code: 'F1', selfLevel: false,
    desc: 'Rate mode. Sticks command rotation, nothing levels you, and the quad holds any attitude you leave it in.' },
  { id: 'angle', name: 'Angle', code: 'F2', selfLevel: true, maxTilt: 38, levelP: 7.5,
    desc: 'Self-levelling. Stick deflection is a lean angle, and centring the sticks rolls you back to level.' },
  { id: 'camera', name: 'Camera', code: 'F3', selfLevel: true, maxTilt: 28, levelP: 6.5, hold: true,
    desc: 'Angle mode plus altitude hold and braking, like a camera drone. Up/down, left/right, and yaw to turn — let go and it parks.' }
];
function flightModeById(id) {
  for (var i = 0; i < FLIGHT_MODES.length; i++) if (FLIGHT_MODES[i].id === id) return FLIGHT_MODES[i];
  return FLIGHT_MODES[0];
}

/* Self-levelling / hold gains. */
var STAB = {
  levelMaxRate: 500 * Math.PI / 180,  // rad/s  outer-loop output clamp
  maxClimb: 3.5,                      // m/s    camera-mode climb/descend command
  altP: 0.9,                          // 1/s    altitude error -> target climb rate
  climbP: 0.16,                       // throttle per (m/s) of climb-rate error
  climbI: 0.22,                       // throttle per (m/s . s)
  climbILimit: 0.45,
  brakeP: 0.16,                       // rad of lean per (m/s) of unwanted drift
  brakeMax: 0.30                      // rad  ~17 deg of braking lean
};

/* Graphics presets. Each one is a real cost lever: resolution, whether the
 * sun casts shadows at all, how much scenery gets built, and how many point
 * lights a material has to loop over. */
var GFX_PRESETS = [
  { id: 'low', name: 'Low', dpr: 1.0, shadows: false, shadowMap: 1024,
    trees: 34, lights: 1, discs: false, scanlines: false, fogScale: 0.55, stars: 500 },
  { id: 'medium', name: 'Medium', dpr: 1.5, shadows: true, shadowMap: 1024,
    trees: 70, lights: 3, discs: true, scanlines: true, fogScale: 0.85, stars: 900 },
  { id: 'high', name: 'High', dpr: 2.0, shadows: true, shadowMap: 1536,
    trees: 120, lights: 6, discs: true, scanlines: true, fogScale: 1.0, stars: 1400 }
];
var GFX = GFX_PRESETS[2];
function gfxById(id) {
  for (var i = 0; i < GFX_PRESETS.length; i++) if (GFX_PRESETS[i].id === id) return GFX_PRESETS[i];
  return GFX_PRESETS[2];
}

var MAPS = [
  { id: 'field', name: 'Sunset Field', code: 'M1', light: 'day',
    desc: 'Open grass, low sun, a breeze off the treeline. Room to make mistakes.' },
  { id: 'night', name: 'Night Circuit', code: 'M2', light: 'night',
    desc: 'Lit gates and nothing else. You fly the LEDs, not the ground.' },
  { id: 'hangar', name: 'The Hangar', code: 'M3', light: 'indoor',
    desc: 'Indoor, no wind, concrete. Tight lines between the pillars.' }
];

var SCENARIOS = [
  { id: 'free', name: 'Free Flight', code: 'S1', camera: 'fpv',
    desc: 'No clock and no gates. Learn the airframe.' },
  { id: 'race', name: 'Time Trial', code: 'S2', camera: 'fpv', laps: 3,
    desc: 'Three laps of the course against the clock. Gate splits shown live.' },
  { id: 'rush', name: 'Gate Rush', code: 'S3', camera: 'fpv', seconds: 45, bonus: 4,
    desc: 'Forty-five seconds. Every gate you take adds four more.' },
  { id: 'recover', name: 'Recovery Drill', code: 'S4', camera: 'fpv',
    desc: 'Dropped inverted, tumbling and already sinking. Read the attitude, roll upright, then power out — before the ground arrives.' },

    desc: 'The camera stays on the ground where you are standing. Fly the course by eye, like a real field.' }
];

/* ================================================================== *
 * SETTINGS / RECORDS  (localStorage, degrades to memory)
 * ================================================================== */
var Store = {
  key: 'acrofpv.v2',
  data: { rates: 'sport', idleMode: 'airmode', flightMode: 'acro', airframe: 'five', invertPitch: false, gfx: 'high', map: 'field', scenario: 'race', arms: true, volume: 0.7, sound: true, records: {} },
  load: function () {
    try {
      var raw = localStorage.getItem(this.key);
      if (raw) {
        var p = JSON.parse(raw);
        for (var k in p) if (Object.prototype.hasOwnProperty.call(p, k)) this.data[k] = p[k];
      }
    } catch (e) { /* private mode, blocked storage: memory-only is fine */ }
    return this.data;
  },
  save: function () {
    try {
      localStorage.setItem(this.key, JSON.stringify(this.data));
      return true;
    } catch (e) {
      // Ghost laps are by far the biggest thing in here and the most
      // expendable. Drop them rather than lose settings and records.
      this.data.ghosts = {};
      try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e2) {}
      return false;
    }
  },
  // Keep a handful of ghosts, newest first; a lap is ~100 KB of samples.
  pruneGhosts: function (keep) {
    var g = this.data.ghosts;
    if (!g) return;
    var keys = Object.keys(g);
    if (keys.length <= keep) return;
    keys.sort(function (a, b) { return (g[b].savedAt || 0) - (g[a].savedAt || 0); });
    for (var i = keep; i < keys.length; i++) delete g[keys[i]];
  },
  record: function (map, scenario) {
    return this.data.records[map + '.' + scenario];
  },
  setRecord: function (map, scenario, value, lowerIsBetter) {
    var k = map + '.' + scenario, cur = this.data.records[k];
    var better = cur === undefined || (lowerIsBetter ? value < cur : value > cur);
    if (better) { this.data.records[k] = value; this.save(); }
    return better;

  disarm: function () { this.blip(700, 0.07, 'square', 0.09); this.blip(440, 0.12, 'square', 0.09, 0.07); },
  move: function () { this.blip(1250, 0.025, 'square', 0.045); },
  select: function () { this.blip(760, 0.05, 'square', 0.09); this.blip(1140, 0.07, 'square', 0.08, 0.045); },
  back: function () { this.blip(520, 0.06, 'square', 0.07); },

  move: function (pad, which, e) {
    var r = pad.getBoundingClientRect();
    var nx = clamp(((e.clientX - r.left) / r.width - 0.5) * 2, -1, 1);
    var ny = clamp(((e.clientY - r.top) / r.height - 0.5) * 2, -1, 1);
    if (which === 'R') {
      this.roll = nx;
      this.pitch = -ny;          // finger up = stick away = nose down = forward
      this.thumb(pad, nx, ny);
    } else {
      this.yaw = nx;
      if (Input.mode && Input.mode.hold) {
        this.climb = -ny;        // climb command about the centre
        this.thumb(pad, nx, ny);
      } else {
        this.thr = clamp((1 - (e.clientY - r.top) / r.height), 0, 1);
        this.thumb(pad, nx, ny);
        this.setThrottleMark();
      }
    }
  },

  thumb: function (pad, nx, ny) {
    var i = pad.querySelector('i');
    i.style.transform = 'translate(' + (nx * 33).toFixed(1) + '%,' + (ny * 33).toFixed(1) + '%)';
  },

  setThrottleMark: function () {
    if (this.padL) this.padL.style.setProperty('--thr', ((1 - this.thr) * 100).toFixed(1) + '%');
  },

  // Hide the sticks whenever a menu is up; the menu is tappable on its own.
  setVisible: function (v) {
    if (!this.enabled) return;
    this.root.hidden = !v;
  },

  setArmed: function (armed) {
    var b = document.getElementById('tArm');
    if (b) { b.classList.toggle('armed', !!armed); b.textContent = armed ? 'DISARM' : 'ARM'; }
  }
};

function dz(v) {
  var d = CFG.deadzone;
  if (Math.abs(v) < d) return 0;
  return (v - Math.sign(v) * d) / (1 - d);
}
function clamp(v, a, b) { return v < a ? a : v > b ? b : v; }
function approach(cur, target, dt, tau) { return cur + (target - cur) * (1 - Math.exp(-dt / tau)); }
function fmtTime(s) {
  if (s === null || s === undefined) return '--.--';
  if (s >= 60) return Math.floor(s / 60) + ':' + (s % 60 < 10 ? '0' : '') + (s % 60).toFixed(2);
  return s.toFixed(2);
}

/* ================================================================== *
 * MAIN
 * ================================================================== */
function start() {
  var THREE = window.THREE;
  Store.load();

  var renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('scene'), antialias: true, powerPreference: 'high-performance' });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, GFX.dpr));
  renderer.setSize(window.innerWidth, window.innerHeight, false);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  if (THREE.sRGBEncoding !== undefined) renderer.outputEncoding = THREE.sRGBEncoding;
  if (THREE.ACESFilmicToneMapping !== undefined) renderer.toneMapping = THREE.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.0;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(CFG.fpvFov, window.innerWidth / window.innerHeight, 0.03, 3000);
  scene.add(camera);

  var world = new THREE.Group();
  scene.add(world);

  /* ---------------- texture helpers ---------------- */
  function canvasTex(size, draw, rx, ry) {
    var c = document.createElement('canvas');
    c.width = c.height = size;
    draw(c.getContext('2d'), size);
    var t = new THREE.CanvasTexture(c);
    t.wrapS = t.wrapT = THREE.RepeatWrapping;
    t.repeat.set(rx || 1, ry || rx || 1);
    t.anisotropy = renderer.capabilities.getMaxAnisotropy ? Math.min(8, renderer.capabilities.getMaxAnisotropy()) : 1;
    if (THREE.sRGBEncoding !== undefined) t.encoding = THREE.sRGBEncoding;
    return t;
  }
  function speckle(g, size, count, colors, rMin, rMax) {
    for (var i = 0; i < count; i++) {
      g.fillStyle = colors[(Math.random() * colors.length) | 0];
      var x = Math.random() * size, y = Math.random() * size;
      var r = rMin + Math.random() * (rMax - rMin);
      g.beginPath(); g.arc(x, y, r, 0, Math.PI * 2); g.fill();
    }
  }
  var grassTex = function () {
    return canvasTex(512, function (g, s) {
      g.fillStyle = '#41562f'; g.fillRect(0, 0, s, s);
      speckle(g, s, 900, ['#4a6136', '#3a4d29', '#546b3c', '#455a31'], 3, 16);
      // mowing stripes, the reason a field reads as a field
      g.globalAlpha = 0.035;
      g.fillStyle = '#ffffff'; g.fillRect(0, 0, s / 2, s);
      g.globalAlpha = 1;
    }, 55);
  };
  var asphaltTex = function () {
    return canvasTex(512, function (g, s) {
      g.fillStyle = '#1b1d20'; g.fillRect(0, 0, s, s);
      speckle(g, s, 1600, ['#232629', '#141618', '#2a2d31'], 1, 4);
    }, 60);
  };
  var concreteTex = function () {
    return canvasTex(512, function (g, s) {
      g.fillStyle = '#575654'; g.fillRect(0, 0, s, s);
      speckle(g, s, 1400, ['#5e5d5a', '#4e4d4b', '#646360'], 1, 5);
      g.strokeStyle = 'rgba(0,0,0,0.32)'; g.lineWidth = 3;
      g.strokeRect(0, 0, s, s);
    }, 14);
  };
  var panelTex = function () {
    return canvasTex(256, function (g, s) {
      g.fillStyle = '#3d4248'; g.fillRect(0, 0, s, s);
      for (var x = 0; x < s; x += 16) {
        g.fillStyle = (x / 16) % 2 ? '#454b52' : '#363b41';
        g.fillRect(x, 0, 16, s);
      }
      g.fillStyle = 'rgba(0,0,0,0.25)';
      g.fillRect(0, 0, s, 3);
    }, 8, 3);
  };

  var disposables = [];
  function track(obj) { disposables.push(obj); return obj; }

  function clearWorld() {
    for (var i = world.children.length - 1; i >= 0; i--) world.remove(world.children[i]);
    disposables.forEach(function (d) { if (d && d.dispose) d.dispose(); });
    disposables = [];
  }

  function mat(opts) { return track(new THREE.MeshStandardMaterial(opts)); }
  function basic(opts) { return track(new THREE.MeshBasicMaterial(opts)); }
  function geo(g) { return track(g); }

  /* ---------------- gates ---------------- */
  function makeGate(d, style) {
    var g = new THREE.Group();
    g.position.set(d.x, d.y, d.z);
    g.rotation.y = d.yaw;

    var ringGeo = geo(new THREE.TorusGeometry(d.r, 0.13, 10, 48));
    var frameCol = style === 'neon' ? 0x141820 : style === 'indoor' ? 0x23262b : 0x20242c;
    var ring = new THREE.Mesh(ringGeo, mat({ color: frameCol, roughness: 0.65, metalness: 0.25 }));
    ring.castShadow = style === 'day';
    g.add(ring);

    // The band that lights up for the gate you are meant to take next.
    var glowMat = basic({ color: 0x39506e, transparent: true, opacity: style === 'neon' ? 0.95 : 0.85 });
    var glow = new THREE.Mesh(geo(new THREE.TorusGeometry(d.r - 0.17, style === 'neon' ? 0.075 : 0.055, 8, 48)), glowMat);
    g.add(glow);

    if (style === 'day') {
      // Course flags: cheap, and they show you the wind.
      for (var f = 0; f < 4; f++) {
        var a = Math.PI / 4 + f * Math.PI / 2;
        var flag = new THREE.Mesh(geo(new THREE.PlaneGeometry(0.5, 0.34)),
          mat({ color: f % 2 ? 0xff5c16 : 0xf2ece2, roughness: 0.9, side: THREE.DoubleSide }));
        flag.position.set(Math.cos(a) * (d.r + 0.32), Math.sin(a) * (d.r + 0.32), 0);
        flag.rotation.z = a;
        g.add(flag);
      }
    }
    if (style === 'indoor') {
      for (var h = 0; h < 12; h++) {
        var ha = (h / 12) * Math.PI * 2;
        var chunk = new THREE.Mesh(geo(new THREE.BoxGeometry(0.3, 0.16, 0.16)),
          mat({ color: h % 2 ? 0xffc042 : 0x1a1a1a, roughness: 0.8 }));
        chunk.position.set(Math.cos(ha) * d.r, Math.sin(ha) * d.r, 0);
        chunk.rotation.z = ha;
        g.add(chunk);
      }
    }

    // Legs to the ground (skipped where the gate hangs indoors).
    if (d.y - d.r * 0.75 > 0.3 && !d.hang) {
      for (var s = -1; s <= 1; s += 2) {
        var legH = d.y - d.r * 0.72;
        var leg = new THREE.Mesh(geo(new THREE.CylinderGeometry(0.06, 0.09, legH, 8)),
          mat({ color: frameCol, roughness: 0.8 }));
        leg.position.set(s * d.r * 0.7, -d.y + legH / 2 + 0.02, 0);
        leg.castShadow = style === 'day';
        g.add(leg);
      }
    }

    world.add(g);
    return {
      def: d, group: g, glowMat: glowMat, style: style,
      centre: new THREE.Vector3(d.x, d.y, d.z),
      normal: new THREE.Vector3(Math.sin(d.yaw), 0, Math.cos(d.yaw)),
      radius: d.r, prevSide: 0
    };
  }

  /* ---------------- shared props ---------------- */
  function addPylon(x, z, h, out) {
    var m = new THREE.Mesh(geo(new THREE.CylinderGeometry(0.42, 0.58, h, 14)),
      mat({ color: 0xd8452f, roughness: 0.75 }));
    m.position.set(x, h / 2, z);
    m.castShadow = true; m.receiveShadow = true;
    world.add(m);
    var band = new THREE.Mesh(geo(new THREE.CylinderGeometry(0.6, 0.6, 0.7, 14)),
      mat({ color: 0xf2ece2, roughness: 0.8 }));
    band.position.set(x, h * 0.66, z);
    world.add(band);
    out.push({ x: x, z: z, h: h, r: 0.62 });
  }

  // A treeline is 90 trees; as separate meshes that is 360 draw calls, so
  // the whole line ships as two instanced meshes instead.
  function addTreeline(specs) {
    var n = specs.length;
    var trunk = new THREE.InstancedMesh(geo(new THREE.CylinderGeometry(0.22, 0.34, 2.6, 6)),
      mat({ color: 0x3d3026, roughness: 1 }), n);
    var crown = new THREE.InstancedMesh(geo(new THREE.ConeGeometry(2.1, 5.6, 7)),
      mat({ color: 0x2f4423, roughness: 1, flatShading: true }), n);
    var m = new THREE.Matrix4(), q = new THREE.Quaternion(), pos = new THREE.Vector3(), sc = new THREE.Vector3();
    specs.forEach(function (t, i) {
      var s = t[2];
      q.setFromAxisAngle(new THREE.Vector3(0, 1, 0), Math.random() * Math.PI);
      sc.set(s, s, s);
      pos.set(t[0], 1.3 * s, t[1]);
      m.compose(pos, q, sc);
      trunk.setMatrixAt(i, m);
      pos.set(t[0], 4.4 * s, t[1]);
      m.compose(pos, q, sc);
      crown.setMatrixAt(i, m);
    });
    trunk.instanceMatrix.needsUpdate = true;
    crown.instanceMatrix.needsUpdate = true;
    world.add(trunk);
    world.add(crown);
  }

  function addBarrier(x, z, yaw, len) {
    var g = new THREE.Group();
    g.position.set(x, 0, z);
    g.rotation.y = yaw;
    var board = new THREE.Mesh(geo(new THREE.BoxGeometry(len, 0.62, 0.1)),
      mat({ color: 0xf2ece2, roughness: 0.85 }));
    board.position.y = 0.62;
    board.castShadow = true; board.receiveShadow = true;
    g.add(board);
    var stripe = new THREE.Mesh(geo(new THREE.BoxGeometry(len, 0.2, 0.12)),
      mat({ color: 0xff5c16, roughness: 0.85 }));
    stripe.position.y = 0.62;
    g.add(stripe);
    for (var s = -1; s <= 1; s += 2) {
      var leg = new THREE.Mesh(geo(new THREE.BoxGeometry(0.09, 0.62, 0.5)), mat({ color: 0xcfc8bd, roughness: 0.9 }));
      leg.position.set(s * len * 0.45, 0.31, 0);
      g.add(leg);
    }
    world.add(g);
  }

  function addPad(x, z) {
    var p = new THREE.Mesh(geo(new THREE.CircleGeometry(2.3, 44)),
      mat({ color: 0x15181c, roughness: 0.95 }));
    p.rotation.x = -Math.PI / 2;
    p.position.set(x, 0.02, z);
    p.receiveShadow = true;
    world.add(p);
    var ring = new THREE.Mesh(geo(new THREE.RingGeometry(1.95, 2.25, 44)),
      basic({ color: 0xffb020, side: THREE.DoubleSide }));
    ring.rotation.x = -Math.PI / 2;
    ring.position.set(x, 0.03, z);
    world.add(ring);
  }

  /* ---------------- sky ---------------- */
  var skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      top: { value: new THREE.Color(0x1f5b9a) },
      mid: { value: new THREE.Color(0x9fc3d8) },
      bot: { value: new THREE.Color(0xd8b98a) },
      sunDir: { value: new THREE.Vector3(0.4, 0.25, -0.85).normalize() },
      sunCol: { value: new THREE.Color(0xffd9a0) },
      sunPow: { value: 1.0 }
    },
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: [
      'uniform vec3 top; uniform vec3 mid; uniform vec3 bot; uniform vec3 sunDir; uniform vec3 sunCol; uniform float sunPow;',
      'varying vec3 vP;',
      'void main(){',
      '  vec3 d = normalize(vP);',
      '  float h = d.y;',
      '  vec3 c = h > 0.0 ? mix(mid, top, pow(h, 0.55)) : mix(mid, bot, pow(-h, 0.45));',
      '  float s = max(dot(d, normalize(sunDir)), 0.0);',
      '  c += sunCol * pow(s, 340.0) * 1.5 * sunPow;',        // the disc
      '  c += sunCol * pow(s, 6.0) * 0.20 * sunPow;',          // the haze around it
      '  gl_FragColor = vec4(c, 1.0);',
      '}'
    ].join('\n')
  });
  var sky = new THREE.Mesh(new THREE.SphereGeometry(1400, 32, 20), skyMat);
  sky.frustumCulled = false;
  scene.add(sky);

  function setSky(top, mid, bot, sunDir, sunCol, sunPow) {
    skyMat.uniforms.top.value.setHex(top);
    skyMat.uniforms.mid.value.setHex(mid);
    skyMat.uniforms.bot.value.setHex(bot);
    skyMat.uniforms.sunDir.value.copy(sunDir).normalize();
    skyMat.uniforms.sunCol.value.setHex(sunCol);
    skyMat.uniforms.sunPow.value = sunPow;
  }

  /* ---------------- lights (rebuilt per map) ---------------- */
  var hemi = new THREE.HemisphereLight(0xbcd8ee, 0x4a4437, 0.8);
  scene.add(hemi);
  var sun = new THREE.DirectionalLight(0xfff2dc, 1.1);
  sun.castShadow = true;
  sun.shadow.mapSize.set(GFX.shadowMap, GFX.shadowMap);
  var sc = sun.shadow.camera;
  sc.near = 5; sc.far = 260; sc.left = -90; sc.right = 90; sc.top = 90; sc.bottom = -90;
  sun.shadow.bias = -0.0007;
  scene.add(sun);
  scene.add(sun.target);

  /* ================= MAP BUILDERS ================= */
  var COURSES = {
    field: [
      { x: 0,   y: 3.0, z: -14, yaw: 0,               r: 3.2 },
      { x: 22,  y: 4.6, z: -38, yaw: -Math.PI * 0.28, r: 3.0 },
      { x: 48,  y: 2.6, z: -14, yaw: -Math.PI * 0.62, r: 3.0 },
      { x: 40,  y: 7.0, z: 26,  yaw: -Math.PI * 0.92, r: 3.4 },
      { x: 4,   y: 3.2, z: 40,  yaw: Math.PI * 0.78,  r: 3.0 },
      { x: -20, y: 5.2, z: 18,  yaw: Math.PI * 0.34,  r: 3.2 }
    ],
    night: [
      { x: 0,   y: 3.2, z: -16, yaw: 0,               r: 3.0 },
      { x: 26,  y: 8.5, z: -34, yaw: -Math.PI * 0.32, r: 2.8 },
      { x: 44,  y: 2.4, z: -6,  yaw: -Math.PI * 0.70, r: 2.8 },
      { x: 24,  y: 10.0, z: 22, yaw: -Math.PI * 1.02, r: 3.0 },
      { x: -10, y: 2.6, z: 34,  yaw: Math.PI * 0.70,  r: 2.8 },
      { x: -26, y: 6.0, z: 6,   yaw: Math.PI * 0.24,  r: 3.0 }
    ],
    hangar: [
      { x: 0,   y: 2.6, z: -10, yaw: 0,               r: 2.3 },
      { x: 17,  y: 5.4, z: -22, yaw: -Math.PI * 0.33, r: 2.1, hang: true },
      { x: 24,  y: 2.2, z: 4,   yaw: -Math.PI * 0.78, r: 2.1 },
      { x: 2,   y: 6.2, z: 16,  yaw: Math.PI * 0.94,  r: 2.3, hang: true },
      { x: -19, y: 2.4, z: 2,   yaw: Math.PI * 0.30,  r: 2.1 }
    ]
  };

  function buildField() {
    var spec = { gates: [], pylons: [], spawn: { x: 0, y: CFG.groundY, z: 8, yaw: 0 },
      // Wind is a VELOCITY field in m/s now, felt through drag like real air.
      // 3.9 m/s mean (~8 kt) with gusts to about 6.5 — an ordinary flyable day.
      pilot: new THREE.Vector3(0, 1.65, 15), wind: { x: 3.5, z: 1.6, gust: 2.4 },
      fog: 0xc3b696, fogNear: 90, fogFar: 620, ceiling: 0 };

    setSky(0x2f6ea8, 0xbcd0d6, 0xe8bd84, new THREE.Vector3(-0.55, 0.16, -0.8), 0xffcf8f, 1.0);
    scene.fog = new THREE.Fog(spec.fog, spec.fogNear, spec.fogFar * GFX.fogScale);
    hemi.color.setHex(0xc9dcf0); hemi.groundColor.setHex(0x5b5133); hemi.intensity = 0.75;
    sun.color.setHex(0xffd9a8); sun.intensity = 1.25;
    sun.position.set(-70, 26, -100);
    sun.target.position.set(10, 0, 0);
    renderer.toneMappingExposure = 1.05;

    var ground = new THREE.Mesh(geo(new THREE.PlaneGeometry(1800, 1800)),
      mat({ map: grassTex(), roughness: 1 }));
    disposables.push(ground.material.map);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    world.add(ground);

    addPad(spec.spawn.x, spec.spawn.z);
    COURSES.field.forEach(function (d) { spec.gates.push(makeGate(d, 'day')); });
    [[10, -26, 7], [32, -26, 6], [26, 4, 9], [-8, 6, 5], [18, 32, 8], [-14, -6, 6]]
      .forEach(function (p) { addPylon(p[0], p[1], p[2], spec.pylons); });

    addBarrier(-4, 13, 0, 9);
    addBarrier(8, 13, 0, 9);
    addBarrier(-22, -2, Math.PI / 2, 8);

    // Treeline: keeps the horizon honest and gives you distance cues.
    var trees = [];
    for (var i = 0; i < GFX.trees; i++) {
      var a = (i / GFX.trees) * Math.PI * 2 + Math.random() * 0.5;
      var d = 95 + Math.random() * 150;
      trees.push([Math.cos(a) * d, Math.sin(a) * d, 0.9 + Math.random() * 1.3]);
    }
    addTreeline(trees);
    for (var h = 0; h < 7; h++) {
      var ha = Math.random() * Math.PI * 2, hd = 420 + Math.random() * 380;
      var hill = new THREE.Mesh(geo(new THREE.ConeGeometry(90 + Math.random() * 120, 40 + Math.random() * 70, 9)),
        mat({ color: 0x4e5a4a, roughness: 1, flatShading: true }));
      hill.position.set(Math.cos(ha) * hd, -4, Math.sin(ha) * hd);
      world.add(hill);
    }
    return spec;
  }

  function buildNight() {
    var spec = { gates: [], pylons: [], spawn: { x: 0, y: CFG.groundY, z: 10, yaw: 0 },
      // Still night air: 1.4 m/s (~3 kt) with the odd light gust.
      pilot: new THREE.Vector3(0, 1.65, 17), wind: { x: 1.2, z: 0.7, gust: 0.9 },
      fog: 0x05070d, fogNear: 30, fogFar: 260, ceiling: 0, night: true };

    setSky(0x05070f, 0x0a1020, 0x0d1219, new THREE.Vector3(0.5, 0.4, 0.7), 0x9fb6d8, 0.15);
    scene.fog = new THREE.Fog(spec.fog, spec.fogNear, spec.fogFar * GFX.fogScale);
    hemi.color.setHex(0x2a3a55); hemi.groundColor.setHex(0x07090c); hemi.intensity = 0.28;
    sun.color.setHex(0x9db4d8); sun.intensity = 0.22;
    sun.position.set(60, 80, 70);
    sun.target.position.set(0, 0, 0);
    renderer.toneMappingExposure = 1.15;

    var ground = new THREE.Mesh(geo(new THREE.PlaneGeometry(1200, 1200)),
      mat({ map: asphaltTex(), roughness: 0.95 }));
    disposables.push(ground.material.map);
    ground.rotation.x = -Math.PI / 2;
    ground.receiveShadow = true;
    world.add(ground);

    // Stars
    var starGeo = geo(new THREE.BufferGeometry());
    var pts = [];
    for (var s = 0; s < GFX.stars; s++) {
      var u = Math.random() * Math.PI * 2, v = Math.random() * 0.85 + 0.05;
      var r = 900;
      pts.push(Math.cos(u) * Math.sin(v * Math.PI / 2) * r, Math.cos(v * Math.PI / 2) * r * 0.9 + 40, Math.sin(u) * Math.sin(v * Math.PI / 2) * r);
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    var stars = new THREE.Points(starGeo, track(new THREE.PointsMaterial({ color: 0xdde6ff, size: 2.4, sizeAttenuation: false, transparent: true, opacity: 0.85, fog: false })));
    world.add(stars);

    var moon = new THREE.Mesh(geo(new THREE.SphereGeometry(26, 20, 16)), basic({ color: 0xdfe6f5, fog: false }));
    moon.position.set(360, 300, 500);
    world.add(moon);

    // A single light that follows the active gate, rather than one per gate.
    spec.gateLight = new THREE.PointLight(0xffffff, 3.2, 26, 2);
    world.add(spec.gateLight);

    addPad(spec.spawn.x, spec.spawn.z);

    var neon = [0x22e0ff, 0xff3ea5, 0x9dff3c, 0xffb020, 0x6a7bff, 0xff5c16];
    COURSES.night.forEach(function (d, i) {
      var g = makeGate(d, 'neon');
      g.neon = neon[i % neon.length];
      // A second, larger halo ring reads from much further out at night.
      var halo = new THREE.Mesh(geo(new THREE.TorusGeometry(d.r + 0.02, 0.05, 8, 48)),
        basic({ color: g.neon, transparent: true, opacity: 0.9 }));
      g.group.add(halo);
      g.halo = halo;
      spec.gates.push(g);
    });

    // Light poles mark the field edge without lighting the ground much.
    var lampCount = 0;
    for (var p = 0; p < 10; p++) {
      var pa = (p / 10) * Math.PI * 2, pd = 58;
      var px = Math.cos(pa) * pd, pz = Math.sin(pa) * pd;
      var pole = new THREE.Mesh(geo(new THREE.CylinderGeometry(0.12, 0.16, 7, 8)), mat({ color: 0x1a1e24, roughness: 0.9 }));
      pole.position.set(px, 3.5, pz);
      world.add(pole);
      var head = new THREE.Mesh(geo(new THREE.SphereGeometry(0.34, 10, 8)), basic({ color: 0xffd9a0 }));

  var st = {
    pos: new THREE.Vector3(), vel: new THREE.Vector3(),

    armed: false, motor: 0, motors: [0, 0, 0, 0],

  /* ================================================================== *
   * PHYSICS
   *
   * The chain is the real one: sticks -> Betaflight rates -> a P+D rate
   * loop -> a motor mix -> four motor RPMs with their own spool lag ->
   * four thrusts and four prop drag torques -> rigid-body dynamics with
   * anisotropic aerodynamic drag. Nothing short-circuits it, so control
   * authority is always whatever the motors can actually produce.
   * ================================================================== */
  var windPhase = 0, pwPhase = 0;

   * Betaflight QUAD X numbering, 1 = rear right. Diagonal pairs share a
   * rotation direction, so yawDir is equal within a diagonal — that is
   * what makes a diagonal pair produce pure yaw and no roll or pitch.
   *   torque about X (pitch, nose up +) = -z * T
   *   torque about Z (roll,  left  +) = +x * T
   *   torque about Y (yaw,   left  +) = yawDir * T * propTorqueArm      */
  var MOTORS = [
    { x:  QUAD.armM, z:  QUAD.armM, yawDir: -1 },   // 1 rear right
    { x:  QUAD.armM, z: -QUAD.armM, yawDir:  1 },   // 2 front right
    { x: -QUAD.armM, z:  QUAD.armM, yawDir:  1 },   // 3 rear left
    { x: -QUAD.armM, z: -QUAD.armM, yawDir: -1 }    // 4 front left
  ];
  MOTORS.forEach(function (m) {
    m.mixRoll = m.x / QUAD.armM;        // +1 right, -1 left
    m.mixPitch = -m.z / QUAD.armM;      // +1 front, -1 rear
    m.mixYaw = m.yawDir;
  });

  /* Rate-loop gains. Betaflight's P/I/D are fixed numbers, so the authority
   * they buy rises and falls with throttle exactly as the mixer's available
   * differential thrust does. We pick kP to give FC.tau at the throttle a
   * pilot actually tunes at (hover), and let everything else follow.
   *   dTau/dMix = 4 * arm * (dT/dcmd)   for a two-up two-down mix            */
  var _dTdm = QUAD.thrustPerMotorN * QUAD.thrustExp *
              Math.pow(FC.gainThrottleRef, QUAD.thrustExp - 1);   // N per unit of mix
  var KP = {
    roll:  QUAD.Iroll  / (FC.tau.roll  * 4 * QUAD.armM * _dTdm),
    pitch: QUAD.Ipitch / (FC.tau.pitch * 4 * QUAD.armM * _dTdm),
    yaw:   QUAD.Iyaw   / (FC.tau.yaw   * 4 * QUAD.propTorqueArm * _dTdm)
  };

  /* Swapping aircraft rewrites QUAD, the loop gains and the pack in place,
   * then rebuilds everything derived from them. Nothing downstream needs to
   * know the airframe changed — it just reads the same names it always did. */
  var AF = AIRFRAMES[0];
  function recomputeDerived() {
    MOTORS[0].x =  QUAD.armM; MOTORS[0].z =  QUAD.armM;
    MOTORS[1].x =  QUAD.armM; MOTORS[1].z = -QUAD.armM;
    MOTORS[2].x = -QUAD.armM; MOTORS[2].z =  QUAD.armM;
    MOTORS[3].x = -QUAD.armM; MOTORS[3].z = -QUAD.armM;
    MOTORS.forEach(function (m) {
      m.mixRoll = m.x / QUAD.armM;
      m.mixPitch = -m.z / QUAD.armM;
      m.mixYaw = m.yawDir;
    });
    var dTdm = QUAD.thrustPerMotorN * QUAD.thrustExp *
               Math.pow(FC.gainThrottleRef, QUAD.thrustExp - 1);
    KP.roll  = QUAD.Iroll  / (FC.tau.roll  * 4 * QUAD.armM * dTdm);
    KP.pitch = QUAD.Ipitch / (FC.tau.pitch * 4 * QUAD.armM * dTdm);
    KP.yaw   = QUAD.Iyaw   / (FC.tau.yaw   * 4 * QUAD.propTorqueArm * dTdm);
  }

    AF = a;
    var k;
    for (k in a.quad) if (Object.prototype.hasOwnProperty.call(a.quad, k)) QUAD[k] = a.quad[k];
    for (k in a.battery) if (Object.prototype.hasOwnProperty.call(a.battery, k)) CFG.battery[k] = a.battery[k];
    FC.tau.roll = a.fc.roll; FC.tau.pitch = a.fc.pitch; FC.tau.yaw = a.fc.yaw;
    CFG.groundY = a.groundY;

    // have them. A whoop next to a 7" should look like a whoop next to a 7".

   * which is exactly how little ground effect a real 5" quad has. It is

  function groundEffect(agl) {
    var z = agl > QUAD.propRadiusM * 0.5 ? agl : QUAD.propRadiusM * 0.5;
    var k = QUAD.propRadiusM / (4 * z);
    return clamp(1 / (1 - k * k), 1, 1.12);

  function stepPhysics(dt) {
    var c = Input.ctl, p = Input.profile, i, m;

     * ACRO takes Betaflight's own rate formula straight to the rate loop.
     * The self-levelling modes put an outer angle loop in front of it, which
     * is exactly how ANGLE mode works in the firmware: attitude error times
     * a level gain becomes the rate the inner loop is asked for. Yaw is
     * always a rate command — even a camera drone yaws at a rate. */

    // Stick away from you = nose down = forward, so acro negates ctl.pitch.
    var tp = -bfRate(c.pitch, p.rc.pitch, p.sup.pitch, p.expo.pitch) * DEG;
    var ty = -bfRate(c.yaw,   p.rc.yaw,   p.sup.yaw,   p.expo.yaw)   * DEG;
    var tr = -bfRate(c.roll,  p.rc.roll,  p.sup.roll,  p.expo.roll)  * DEG;

      _fwd.set(0, 0, -1).applyQuaternion(st.quat);

        var head = yawOf(st.quat);

        var vRight = st.vel.x * Math.cos(head) - st.vel.z * Math.sin(head);

        if (Math.abs(c.roll) < 0.06) tgtRoll = clamp(-vRight * STAB.brakeP, -STAB.brakeMax, STAB.brakeMax);
      }

      tp = clamp((tgtPitch - pitchAng) * mode.levelP, -STAB.levelMaxRate, STAB.levelMaxRate);
      tr = -clamp((tgtRoll - rollAng) * mode.levelP, -STAB.levelMaxRate, STAB.levelMaxRate);
