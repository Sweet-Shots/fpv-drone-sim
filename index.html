<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acro FPV</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Saira+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
  :root {
    --ink: #f2ece2;          /* paper-white, warm */
    --ink-dim: #8c9198;
    --ink-faint: #565c63;
    --ground: #0b0c0e;       /* near-black, slight blue */
    --ground-2: #121417;
    --flag: #ff5c16;         /* safety orange: pylons, course flags */
    --flag-deep: #c33d08;
    --live: #7dffb0;         /* telemetry green */
    --alert: #ff4d4d;
    --amber: #ffb020;
    --rule: rgba(242, 236, 226, 0.14);
    --rule-strong: rgba(242, 236, 226, 0.32);
    --display: 'Saira Condensed', 'Arial Narrow', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
    /* PlayStation face-button glyphs are not in every mono face. */
    --sym: 'IBM Plex Mono', 'Segoe UI Symbol', 'Apple Symbols', 'Noto Sans Symbols 2', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--ground);
    color: var(--ink);
    font-family: var(--mono);
    font-size: 13px;
    overflow: hidden;
    -webkit-user-select: none;
    user-select: none;
    touch-action: none;
  }
  canvas { display: block; }
  #scene, #hud { position: fixed; inset: 0; width: 100%; height: 100%; }
  #hud { pointer-events: none; }

  /* ================= in-flight: OSD text only, no panels ================= */
  #hint {
    position: fixed;
    left: 18px;
    bottom: 16px;
    max-width: min(560px, calc(100vw - 36px));
    font-family: var(--mono);
    font-size: 11.5px;
    line-height: 1.9;
    color: rgba(238, 242, 238, 0.82);
    text-shadow: 0 0 3px #000, 0 1px 2px #000;
    pointer-events: none;
    transition: opacity 0.4s;
  }
  #hint b {
    font-family: var(--sym);
    display: inline-block;
    min-width: 0;
    padding: 0 5px;
    margin-right: 5px;
    font-weight: 600;
    color: #fff;
    background: rgba(0, 0, 0, 0.55);
    border: 1px solid rgba(255, 255, 255, 0.28);
  }
  #hint span { margin-right: 16px; white-space: nowrap; }
  #hint.gone { opacity: 0; }

  #toast {
    position: fixed;
    left: 50%;
    top: 26%;
    transform: translate(-50%, -50%);
    font-family: var(--display);
    font-size: 34px;
    font-weight: 700;
    letter-spacing: 0.12em;
    text-align: center;
    opacity: 0;
    transition: opacity 0.2s;
    text-shadow: 0 2px 12px #000, 0 0 3px #000;
    pointer-events: none;
    white-space: nowrap;
  }
  #toast.show { opacity: 1; }

  /* ================= overlays: menu + pause ================= */
  .screen {
    position: fixed;
    inset: 0;
    z-index: 5;
    display: flex;
    flex-direction: column;
    background: var(--ground);
    overflow: auto;
    overscroll-behavior: contain;
  }
  .screen[hidden] { display: none; }
  #pause { background: rgba(11, 12, 14, 0.93); }

  /* grain + a ghosted gate glyph: the room this thing lives in */
  .screen::before {
    content: '';
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
      radial-gradient(ellipse 80% 60% at 78% 42%, rgba(255, 92, 22, 0.07), transparent 70%),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.014) 0 1px, transparent 1px 3px);
  }
  #gateglyph {
    position: absolute;
    right: -6%;
    top: 50%;
    transform: translateY(-50%);
    width: min(52vw, 620px);
    opacity: 0.075;
    pointer-events: none;
  }

  .wrap {
    position: relative;
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding-block: clamp(20px, 4vh, 46px);
    padding-inline: 20px;
    display: flex;
    flex-direction: column;
    gap: clamp(16px, 3vh, 30px);
    flex: 1;
  }

  /* --- masthead --- */
  .mast { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; flex-wrap: wrap; }
  .lockup { display: flex; align-items: baseline; gap: 10px; }
  .lockup h1 {
    margin: 0;
    font-family: var(--display);
    font-weight: 700;
    font-size: clamp(38px, 7vw, 76px);
    line-height: 0.86;
    letter-spacing: -0.015em;
    text-transform: uppercase;
  }
  .lockup h1 em {
    font-style: normal;
    color: transparent;
    -webkit-text-stroke: 1.5px var(--flag);
    text-stroke: 1.5px var(--flag);
  }
  .mast .meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-dim);
    text-align: right;
    line-height: 1.7;
    letter-spacing: 0.04em;
  }
  .mast .meta b { color: var(--ink); font-weight: 500; }

  .rule { height: 1px; background: var(--rule); }
  .rule.strong { background: var(--rule-strong); }

  /* --- three-column selection board --- */
  .board {
    display: grid;
    grid-template-columns: 1.15fr 1fr 1fr;
    gap: 0;
    border-top: 1px solid var(--rule-strong);
    border-bottom: 1px solid var(--rule-strong);
  }
  .col { padding: 14px 18px 16px; border-right: 1px solid var(--rule); }
  .col:last-child { border-right: 0; }
  .col > h2 {
    margin: 0 0 12px;
    font-family: var(--mono);
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.22em;
    text-transform: uppercase;
    color: var(--ink-faint);
  }
  .col.focused > h2 { color: var(--flag); }

  .opt {
    display: grid;
    grid-template-columns: 34px 1fr;
    align-items: baseline;
    gap: 10px;
    width: 100%;
    padding: 7px 8px 7px 10px;
    border: 0;
    border-left: 2px solid transparent;
    background: none;
    color: var(--ink-dim);
    font: inherit;
    text-align: left;
    cursor: pointer;
  }
  .opt .code {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.08em;
    color: var(--ink-faint);
  }
  .opt .name {
    font-family: var(--display);
    font-weight: 600;
    font-size: 19px;
    letter-spacing: 0.015em;
    text-transform: uppercase;
    line-height: 1.1;
  }
  .opt .sub {
    grid-column: 2;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    line-height: 1.5;
    margin-top: 3px;
    display: none;
  }
  .opt:hover { color: var(--ink); }
  .opt[aria-selected="true"] { color: var(--ink); border-left-color: var(--flag); background: rgba(255, 92, 22, 0.05); }
  .opt[aria-selected="true"] .code { color: var(--flag); }
  .opt[aria-selected="true"] .sub { display: block; }
  .opt:focus-visible { outline: 1px solid var(--flag); outline-offset: -1px; }

  /* --- setup rows (toggles / cycles) --- */
  .setrow {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    width: 100%;
    padding: 8px 8px 8px 10px;
    border: 0;
    border-left: 2px solid transparent;
    background: none;
    color: var(--ink-dim);
    font-family: var(--mono);
    font-size: 12px;
    cursor: pointer;
    text-align: left;
  }
  .setrow .v {
    font-weight: 600;
    color: var(--ink);
    letter-spacing: 0.04em;
    white-space: nowrap;
  }
  .setrow[aria-selected="true"] { color: var(--ink); border-left-color: var(--flag); background: rgba(255, 92, 22, 0.05); }
  .setrow[aria-selected="true"] .v { color: var(--flag); }
  .setrow:focus-visible { outline: 1px solid var(--flag); outline-offset: -1px; }
  .setrow .v::before { content: '‹ '; color: var(--ink-faint); }
  .setrow .v::after { content: ' ›'; color: var(--ink-faint); }

  /* --- briefing strip --- */
  .brief { display: grid; grid-template-columns: 1fr auto; gap: 24px; align-items: start; flex: 1; }
  .brief .desc {
    font-family: var(--mono);
    font-size: 12.5px;
    line-height: 1.75;
    color: var(--ink-dim);
    max-width: 62ch;
  }
  .brief .desc b { color: var(--ink); font-weight: 500; }
  .record {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--ink-faint);
    text-align: right;
    letter-spacing: 0.06em;
    line-height: 1.9;
    white-space: nowrap;
  }
  .record .t {
    display: block;
    font-family: var(--display);
    font-size: 30px;
    font-weight: 700;
    letter-spacing: 0.02em;
    color: var(--amber);
    font-variant-numeric: tabular-nums;
  }

  /* --- footer: device-specific bindings only --- */
  .foot { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  .binds { display: flex; flex-wrap: wrap; gap: 6px 18px; font-family: var(--mono); font-size: 11px; color: var(--ink-dim); }
  .binds span { white-space: nowrap; }
  .binds b {
    font-family: var(--sym);
    display: inline-block;
    padding: 1px 6px;
    margin-right: 6px;
    font-weight: 500;
    color: var(--ink);
    border: 1px solid var(--rule-strong);
  }
  .device {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: var(--ink-dim);
    white-space: nowrap;
  }
  .device .dot { width: 7px; height: 7px; background: var(--live); box-shadow: 0 0 8px var(--live); }
  .device.pad .dot { background: #64b5ff; box-shadow: 0 0 8px #64b5ff; }
  .device b { color: var(--ink); font-weight: 600; }

  .go {
    align-self: flex-start;
    display: inline-flex;
    align-items: center;
    gap: 12px;
    padding: 11px 26px;
    border: 0;
    background: var(--flag);
    color: #140800;
    font-family: var(--display);
    font-weight: 700;
    font-size: 22px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    cursor: pointer;
  }
  .go:hover { background: #ff7738; }
  .go:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  .go kbd {
    font-family: var(--sym);
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 0;
    padding: 2px 6px;
    background: rgba(0, 0, 0, 0.22);
  }

  /* --- pause --- */
  #pause .wrap { max-width: 560px; justify-content: center; }
  #pause h2.title {
    margin: 0;
    font-family: var(--display);
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
  }
  #pause .sub { font-family: var(--mono); font-size: 12px; color: var(--ink-dim); }
  .menulist { display: flex; flex-direction: column; border-top: 1px solid var(--rule); }
  .menulist .setrow, .menulist .opt { border-bottom: 1px solid var(--rule); }

  /* --- boot --- */
  #boot {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column; gap: 14px;
    align-items: center; justify-content: center;
    background: var(--ground); text-align: center; padding: 24px;
  }
  #boot .lockup h1 { font-size: clamp(34px, 6vw, 58px); }
  #boot p { margin: 0; font-family: var(--mono); font-size: 12px; color: var(--ink-dim); max-width: 52ch; line-height: 1.7; }
  #boot .bar { width: min(280px, 60vw); height: 2px; background: var(--rule); overflow: hidden; }
  #boot .bar i { display: block; height: 100%; width: 38%; background: var(--flag); animation: slide 1.1s ease-in-out infinite; }
  @keyframes slide { 0% { transform: translateX(-100%); } 100% { transform: translateX(360%); } }
  #boot[hidden] { display: none; }
  .err { color: var(--alert) !important; }

  @media (prefers-reduced-motion: reduce) {
    #boot .bar i { animation: none; width: 100%; }
    * { transition-duration: 0.01ms !important; }
  }

  @media (max-width: 860px) {
    .board { grid-template-columns: 1fr; }
    .col { border-right: 0; border-bottom: 1px solid var(--rule); }
    .col:last-child { border-bottom: 0; }
    .brief { grid-template-columns: 1fr; }
    .record { text-align: left; }
    #gateglyph { display: none; }
    #hint { display: none; }
  }
</style>
</head>
<body>

<canvas id="scene"></canvas>
<canvas id="hud"></canvas>

<div id="hint"></div>
<div id="toast"></div>

<!-- ============================ main menu ============================ -->
<div class="screen" id="menu" hidden>
  <svg id="gateglyph" viewBox="0 0 200 200" fill="none" aria-hidden="true">
    <circle cx="100" cy="88" r="68" stroke="var(--flag)" stroke-width="7"/>
    <circle cx="100" cy="88" r="54" stroke="var(--flag)" stroke-width="2"/>
    <path d="M58 140 L48 196 M142 140 L152 196" stroke="var(--flag)" stroke-width="7"/>
  </svg>
  <div class="wrap">
    <div class="mast">
      <div class="lockup"><h1>Acro <em>FPV</em></h1></div>
      <div class="meta">
        RATE-MODE FLIGHT TRAINER<br>
        <b id="m-rates">SPORT</b> RATES &middot; <b id="m-batt">4S</b> &middot; NO SELF-LEVEL
      </div>
    </div>

    <div class="board">
      <div class="col" id="col-mode"><h2>Session</h2></div>
      <div class="col" id="col-map"><h2>Location</h2></div>
      <div class="col" id="col-setup"><h2>Setup</h2></div>
    </div>

    <div class="brief">
      <div class="desc" id="briefdesc"></div>
      <div class="record" id="briefrecord"></div>
    </div>

    <div class="rule"></div>

    <div class="foot">
      <button class="go" id="startbtn" type="button">Launch <kbd id="gokey">Enter</kbd></button>
      <div class="device" id="devbadge"><span class="dot"></span><b>Keyboard</b></div>
    </div>
    <div class="binds" id="menubinds"></div>
  </div>
</div>

<!-- ============================== pause ============================== -->
<div class="screen" id="pause" hidden>
  <div class="wrap">
    <h2 class="title">Paused</h2>
    <div class="sub" id="pausesub"></div>
    <div class="rule strong"></div>
    <div class="menulist" id="pauselist"></div>
    <div class="binds" id="pausebinds"></div>
  </div>
</div>

<!-- =============================== boot =============================== -->
<div id="boot">
  <div class="lockup"><h1>Acro <em>FPV</em></h1></div>
  <div class="bar"><i></i></div>
  <p id="bootmsg">Loading renderer&hellip;</p>
</div>

<script>
/* ------------------------------------------------------------------ *
 * Three.js: cdnjs first, jsDelivr as fallback.
 * ------------------------------------------------------------------ */
(function loadThree() {
  var sources = [
    'https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js',
    'https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js'
  ];
  var msg = document.getElementById('bootmsg');
  var i = 0;
  (function next() {
    if (i >= sources.length) {
      msg.className = 'err';
      msg.textContent = 'Could not load the 3D renderer from any CDN. Check your connection and reload.';
      return;
    }
    var s = document.createElement('script');
    s.src = sources[i++];
    s.onload = function () {
      if (!window.THREE) { next(); return; }
      try { start(); } catch (e) {
        msg.className = 'err';
        msg.textContent = 'Startup failed: ' + e.message;
        throw e;
      }
    };
    s.onerror = next;
    document.head.appendChild(s);
  })();
})();

/* ================================================================== *
 * TUNING
 * ================================================================== */
var CFG = {
  deadzone: 0.09,
  idleAngDamp: 1.6,
  maxThrust: 26.0,
  gravity: 9.81,
  dragLinear: 0.16,
  dragQuad: 0.0125,
  thrustSpool: 0.06,
  throttleRampUp: 1.15,
  throttleRampDown: 1.35,
  groundY: 0.13,
  crashSpeed: 9.0,
  bounce: 0.22,
  friction: 0.72,
  camTilt: 22 * Math.PI / 180,
  fpvFov: 100,
  chaseFov: 74,
  losFov: 42,
  // 4S pack: 16.8V charged, 14.0V is "land now", sag is proportional to draw.
  battery: { cells: 4, full: 4.2, empty: 3.5, capacity: 190, sag: 0.85 }
};

/* Rate profiles. Real acro quads do run 600-900 deg/s — that is not a bug,
 * it is what freestyle rates feel like. Nobody learns on them, though. */
var RATE_PROFILES = [
  { id: 'cruise', name: 'Cruise', code: 'R1',
    rate: { pitch: 240, roll: 260, yaw: 170 },
    expo: { pitch: 0.30, roll: 0.30, yaw: 0.25 },
    tau:  { pitch: 0.075, roll: 0.070, yaw: 0.100 },
    smooth: 0.11,
    desc: 'Gentle. Rates a trainer quad would ship with.' },
  { id: 'sport', name: 'Sport', code: 'R2',
    rate: { pitch: 380, roll: 420, yaw: 240 },
    expo: { pitch: 0.42, roll: 0.42, yaw: 0.35 },
    tau:  { pitch: 0.055, roll: 0.050, yaw: 0.085 },
    smooth: 0.075,
    desc: 'Quick but recoverable. Start here.' },
  { id: 'acro', name: 'Acro', code: 'R3',
    rate: { pitch: 620, roll: 700, yaw: 380 },
    expo: { pitch: 0.50, roll: 0.50, yaw: 0.40 },
    tau:  { pitch: 0.045, roll: 0.040, yaw: 0.075 },
    smooth: 0.055,
    desc: 'Real freestyle rates. Two rolls a second. Unforgiving.' }
];

var MAPS = [
  { id: 'field', name: 'Sunset Field', code: 'M1', light: 'day',
    desc: 'Open grass, low sun, a breeze off the treeline. Room to make mistakes.' },
  { id: 'night', name: 'Night Circuit', code: 'M2', light: 'night',
    desc: 'Lit gates and nothing else. You fly the LEDs, not the ground.' },
  { id: 'hangar', name: 'The Hangar', code: 'M3', light: 'indoor',
    desc: 'Indoor, no wind, concrete. Tight lines between the pillars.' }
];

var SCENARIOS = [
  { id: 'free', name: 'Free Flight', code: 'S1', camera: 'fpv',
    desc: 'No clock and no gates. Learn the airframe.' },
  { id: 'race', name: 'Time Trial', code: 'S2', camera: 'fpv', laps: 3,
    desc: 'Three laps of the course against the clock. Gate splits shown live.' },
  { id: 'rush', name: 'Gate Rush', code: 'S3', camera: 'fpv', seconds: 45, bonus: 4,
    desc: 'Forty-five seconds. Every gate you take adds four more.' },
  { id: 'recover', name: 'Recovery Drill', code: 'S4', camera: 'fpv',
    desc: 'Dropped inverted and tumbling. Stop the spin, get upright, hold it — before the ground arrives.' },
  { id: 'los', name: 'Line of Sight', code: 'S5', camera: 'los',
    desc: 'The camera stays on the ground where you are standing. Fly the course by eye, like a real field.' }
];

/* ================================================================== *
 * SETTINGS / RECORDS  (localStorage, degrades to memory)
 * ================================================================== */
var Store = {
  key: 'acrofpv.v2',
  data: { rates: 'sport', map: 'field', scenario: 'race', arms: true, volume: 0.7, sound: true, records: {} },
  load: function () {
    try {
      var raw = localStorage.getItem(this.key);
      if (raw) {
        var p = JSON.parse(raw);
        for (var k in p) if (Object.prototype.hasOwnProperty.call(p, k)) this.data[k] = p[k];
      }
    } catch (e) { /* private mode, blocked storage: memory-only is fine */ }
    return this.data;
  },
  save: function () {
    try { localStorage.setItem(this.key, JSON.stringify(this.data)); } catch (e) {}
  },
  record: function (map, scenario) {
    return this.data.records[map + '.' + scenario];
  },
  setRecord: function (map, scenario, value, lowerIsBetter) {
    var k = map + '.' + scenario, cur = this.data.records[k];
    var better = cur === undefined || (lowerIsBetter ? value < cur : value > cur);
    if (better) { this.data.records[k] = value; this.save(); }
    return better;
  }
};

/* ================================================================== *
 * AUDIO — synthesised, no assets
 * ================================================================== */
var Sound = {
  ctx: null, master: null, ready: false,
  engine: null, wind: null, running: false,

  unlock: function () {
    if (this.ctx) { if (this.ctx.state === 'suspended') this.ctx.resume(); return; }
    var AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    try { this.ctx = new AC(); } catch (e) { return; }
    this.master = this.ctx.createGain();
    this.master.gain.value = Store.data.sound ? Store.data.volume : 0;
    this.master.connect(this.ctx.destination);
    this.ready = true;
  },

  setVolume: function () {
    if (this.master) this.master.gain.value = Store.data.sound ? Store.data.volume : 0;
  },

  noiseBuffer: function () {
    if (this._nb) return this._nb;
    var len = this.ctx.sampleRate * 2;
    var b = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
    var d = b.getChannelData(0);
    for (var i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    this._nb = b;
    return b;
  },

  startFlight: function () {
    if (!this.ready || this.running) return;
    var ctx = this.ctx, now = ctx.currentTime;

    // Four motors, slightly detuned — the beat between them is the quad sound.
    var eg = ctx.createGain(); eg.gain.value = 0;
    var lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900;
    eg.connect(lp); lp.connect(this.master);
    var oscs = [];
    [1, 1.007, 0.993, 1.013].forEach(function (ratio) {
      var o = ctx.createOscillator();
      o.type = 'sawtooth';
      o.frequency.value = 90 * ratio;
      var g = ctx.createGain(); g.gain.value = 0.25;
      o.connect(g); g.connect(eg); o.start(now);
      oscs.push({ osc: o, ratio: ratio });
    });
    var sub = ctx.createOscillator();
    sub.type = 'sine'; sub.frequency.value = 45;
    var subg = ctx.createGain(); subg.gain.value = 0.5;
    sub.connect(subg); subg.connect(eg); sub.start(now);

      this.wind.gain.gain.setTargetAtTime(0, t, 0.05);

    g.gain.exponentialRampToValueAtTime(0.0001, t + dur);

    o.start(t); o.stop(t + dur + 0.02);
  },

  crash: function (intensity) {

    var src = this.ctx.createBufferSource();
    src.buffer = this.noiseBuffer();

  gate: function () { this.blip(880, 0.07, 'square', 0.1); this.blip(1320, 0.09, 'square', 0.09, 0.06); },
  arm: function () { this.blip(520, 0.07, 'square', 0.1); this.blip(700, 0.07, 'square', 0.1, 0.07); this.blip(980, 0.11, 'square', 0.1, 0.14); },
  disarm: function () { this.blip(700, 0.07, 'square', 0.09); this.blip(440, 0.12, 'square', 0.09, 0.07); },
  move: function () { this.blip(1250, 0.025, 'square', 0.045); },
  select: function () { this.blip(760, 0.05, 'square', 0.09); this.blip(1140, 0.07, 'square', 0.08, 0.045); },
  back: function () { this.blip(520, 0.06, 'square', 0.07); },
  count: function (last) { this.blip(last ? 990 : 620, last ? 0.28 : 0.11, 'square', 0.12); },
  win: function () { [660, 880, 1320].forEach(function (f, i) { Sound.blip(f, 0.16, 'square', 0.1, i * 0.09); }); },
  fail: function () { this.sweep(420, 90, 0.5, 0.12); },

 * INPUT — keyboard and Gamepad API, interchangeable, neither required

  throttleMode: 'absolute',

      Sound.unlock();
      if (e.repeat) { block(e); return; }

      self.setActive('keyboard');

      // Menu navigation is handled by whoever owns the screen.

      else if (k === 'KeyC') hooks.camera();
      else if (k === 'KeyV') hooks.arms();
      else if (k === 'KeyT') hooks.throttleMode();
      else if (k === 'KeyH') hooks.hint();
      else if (k === 'KeyM') hooks.mute();
      else if (k === 'BracketLeft') hooks.tilt(-1);
      else if (k === 'BracketRight') hooks.tilt(1);
      else if (k === 'Backspace') self.restartPressed();

    window.addEventListener('blur', function () { self.keys = Object.create(null); });
    window.addEventListener('pointerdown', function () { Sound.unlock(); });

    function block(e) {
      if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Backspace'].indexOf(e.code) >= 0) e.preventDefault();
    }

    window.addEventListener('gamepadconnected', function (e) {
      self.padIndex = e.gamepad.index;
      self.padName = e.gamepad.id;

  restartPressed: function () {

  },

  setActive: function (mode) {
    if (this.active === mode) return;

  getPad: function () {

  update: function (dt, inMenu) {
    var e = this.edges;
    e.arm = e.resetDrone = e.camera = e.arms = e.pause = false;
    var n = this.nav;
    n.up = n.down = n.left = n.right = n.select = n.back = false;

    var pad = this.getPad();
    var padActive = false;

    if (pad) {
      if (this.padName !== pad.id) this.padName = pad.id;
      var p = this.profile;
      var lx = curve(dz(pad.axes[0] || 0), p.expo.yaw);
      var ly = dz(pad.axes[1] || 0);
      var rx = curve(dz(pad.axes[2] || 0), p.expo.roll);
      var ry = curve(dz(pad.axes[3] || 0), p.expo.pitch);

        if (pressed && !was) {
          Sound.unlock();
          if (inMenu) {
            if (b === 0) n.select = true;
            else if (b === 1) n.back = true;
            else if (b === 12) n.up = true;
            else if (b === 13) n.down = true;
            else if (b === 14) n.left = true;
            else if (b === 15) n.right = true;
            else if (b === 9) e.pause = true;
          } else {
            if (b === 0) e.arm = true;
            else if (b === 1) e.resetDrone = true;
            else if (b === 2) e.arms = true;
            else if (b === 3) e.camera = true;
            else if (b === 8) this.restartPressed();
            else if (b === 9) e.pause = true;
          }
        }

      }

      if (padActive) this.setActive('gamepad');

    // Keyboard menu navigation is handled directly in the keydown hook.
    var k = this.keys;
    var pitch = (held(k, 'KeyW', 'ArrowUp') ? 1 : 0) - (held(k, 'KeyS', 'ArrowDown') ? 1 : 0);
    var roll  = (held(k, 'KeyD', 'ArrowRight') ? 1 : 0) - (held(k, 'KeyA', 'ArrowLeft') ? 1 : 0);
    var yaw   = (held(k, 'KeyE') ? 1 : 0) - (held(k, 'KeyQ') ? 1 : 0);

    if (held(k, 'ControlLeft', 'ControlRight')) this._thr -= CFG.throttleRampDown * dt;

    }

  // Bindings for the on-screen hints — only ever the active device's.

        : [['↑ ↓ ← →', 'Move'], ['Enter', 'Select'], ['Esc', 'Back']];
    }
    if (context === 'pause') {
      return padMode
        ? [['D-pad', 'Move'], ['✕', 'Select'], ['Options', 'Resume']]
        : [['↑ ↓', 'Move'], ['Enter', 'Select'], ['Esc', 'Resume']];
    }
    return padMode
      ? [['L stick', 'Throttle / yaw'], ['R stick', 'Pitch / roll'], ['✕', 'Arm'], ['○', 'Reset'],
         ['□', 'Prop view'], ['△', 'Camera'], ['Share ×2', 'Restart'], ['Options', 'Pause']]
      : [['W S', 'Pitch'], ['A D', 'Roll'], ['Q E', 'Yaw'], ['Shift Ctrl', 'Throttle'],

  }
};

function dz(v) {
  var d = CFG.deadzone;
  if (Math.abs(v) < d) return 0;
  return (v - Math.sign(v) * d) / (1 - d);
}

/* ================================================================== *
 * MAIN
 * ================================================================== */
function start() {
  var THREE = window.THREE;
  Store.load();

  renderer.toneMappingExposure = 1.0;

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(CFG.fpvFov, window.innerWidth / window.innerHeight, 0.03, 3000);
  scene.add(camera);

  var world = new THREE.Group();
  scene.add(world);

  /* ---------------- texture helpers ---------------- */
  function canvasTex(size, draw, rx, ry) {

    return canvasTex(512, function (g, s) {

  /* ---------------- gates ---------------- */
  function makeGate(d, style) {
    var g = new THREE.Group();
    g.position.set(d.x, d.y, d.z);
    g.rotation.y = d.yaw;

    var ringGeo = geo(new THREE.TorusGeometry(d.r, 0.13, 10, 48));
    var frameCol = style === 'neon' ? 0x141820 : style === 'indoor' ? 0x23262b : 0x20242c;

    var glow = new THREE.Mesh(geo(new THREE.TorusGeometry(d.r - 0.17, style === 'neon' ? 0.075 : 0.055, 8, 48)), glowMat);
    g.add(glow);

      for (var f = 0; f < 4; f++) {
        var a = Math.PI / 4 + f * Math.PI / 2;
        var flag = new THREE.Mesh(geo(new THREE.PlaneGeometry(0.5, 0.34)),
          mat({ color: f % 2 ? 0xff5c16 : 0xf2ece2, roughness: 0.9, side: THREE.DoubleSide }));
        flag.position.set(Math.cos(a) * (d.r + 0.32), Math.sin(a) * (d.r + 0.32), 0);

          mat({ color: h % 2 ? 0xffc042 : 0x1a1a1a, roughness: 0.8 }));

      def: d, group: g, glowMat: glowMat, style: style,
      centre: new THREE.Vector3(d.x, d.y, d.z),
      normal: new THREE.Vector3(Math.sin(d.yaw), 0, Math.cos(d.yaw)),
      radius: d.r, prevSide: 0

  }

  /* ---------------- shared props ---------------- */
  function addPylon(x, z, h, out) {
    var m = new THREE.Mesh(geo(new THREE.CylinderGeometry(0.42, 0.58, h, 14)),
      mat({ color: 0xd8452f, roughness: 0.75 }));
    m.position.set(x, h / 2, z);
    m.castShadow = true; m.receiveShadow = true;
    world.add(m);
    var band = new THREE.Mesh(geo(new THREE.CylinderGeometry(0.6, 0.6, 0.7, 14)),
      mat({ color: 0xf2ece2, roughness: 0.8 }));
    band.position.set(x, h * 0.66, z);

  // the whole line ships as two instanced meshes instead.
  function addTreeline(specs) {
    var n = specs.length;

      mat({ color: 0x3d3026, roughness: 1 }), n);
    var crown = new THREE.InstancedMesh(geo(new THREE.ConeGeometry(2.1, 5.6, 7)),

    var m = new THREE.Matrix4(), q = new THREE.Quaternion(), pos = new THREE.Vector3(), sc = new THREE.Vector3();
    specs.forEach(function (t, i) {
      var s = t[2];

      sc.set(s, s, s);
      pos.set(t[0], 1.3 * s, t[1]);
      m.compose(pos, q, sc);
      trunk.setMatrixAt(i, m);
      pos.set(t[0], 4.4 * s, t[1]);
      m.compose(pos, q, sc);
      crown.setMatrixAt(i, m);
    });
    trunk.instanceMatrix.needsUpdate = true;
    crown.instanceMatrix.needsUpdate = true;
    world.add(trunk);
    world.add(crown);
  }

  function addBarrier(x, z, yaw, len) {
    var g = new THREE.Group();

    var stripe = new THREE.Mesh(geo(new THREE.BoxGeometry(len, 0.2, 0.12)),
      mat({ color: 0xff5c16, roughness: 0.85 }));
    stripe.position.y = 0.62;
    g.add(stripe);
    for (var s = -1; s <= 1; s += 2) {
      var leg = new THREE.Mesh(geo(new THREE.BoxGeometry(0.09, 0.62, 0.5)), mat({ color: 0xcfc8bd, roughness: 0.9 }));
      leg.position.set(s * len * 0.45, 0.31, 0);

  /* ---------------- sky ---------------- */
  var skyMat = new THREE.ShaderMaterial({
    side: THREE.BackSide,
    depthWrite: false,
    uniforms: {
      top: { value: new THREE.Color(0x1f5b9a) },
      mid: { value: new THREE.Color(0x9fc3d8) },
      bot: { value: new THREE.Color(0xd8b98a) },
      sunDir: { value: new THREE.Vector3(0.4, 0.25, -0.85).normalize() },
      sunCol: { value: new THREE.Color(0xffd9a0) },
      sunPow: { value: 1.0 }
    },
    vertexShader: 'varying vec3 vP; void main(){ vP = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }',
    fragmentShader: [
      'uniform vec3 top; uniform vec3 mid; uniform vec3 bot; uniform vec3 sunDir; uniform vec3 sunCol; uniform float sunPow;',
      'varying vec3 vP;',
      'void main(){',
      '  vec3 d = normalize(vP);',
      '  float h = d.y;',
      '  vec3 c = h > 0.0 ? mix(mid, top, pow(h, 0.55)) : mix(mid, bot, pow(-h, 0.45));',
      '  float s = max(dot(d, normalize(sunDir)), 0.0);',
      '  c += sunCol * pow(s, 340.0) * 1.5 * sunPow;',        // the disc
      '  c += sunCol * pow(s, 6.0) * 0.20 * sunPow;',          // the haze around it
      '  gl_FragColor = vec4(c, 1.0);',
      '}'
    ].join('\n')
  });
  var sky = new THREE.Mesh(new THREE.SphereGeometry(1400, 32, 20), skyMat);
  sky.frustumCulled = false;
  scene.add(sky);

    skyMat.uniforms.mid.value.setHex(mid);

    skyMat.uniforms.sunDir.value.copy(sunDir).normalize();
    skyMat.uniforms.sunCol.value.setHex(sunCol);

  function buildField() {

    sun.color.setHex(0xffd9a8); sun.intensity = 1.25;

    sun.target.position.set(10, 0, 0);

    world.add(ground);

    addPad(spec.spawn.x, spec.spawn.z);
    COURSES.field.forEach(function (d) { spec.gates.push(makeGate(d, 'day')); });
    [[10, -26, 7], [32, -26, 6], [26, 4, 9], [-8, 6, 5], [18, 32, 8], [-14, -6, 6]]
      .forEach(function (p) { addPylon(p[0], p[1], p[2], spec.pylons); });

    addBarrier(-4, 13, 0, 9);
    addBarrier(8, 13, 0, 9);
    addBarrier(-22, -2, Math.PI / 2, 8);

    // Treeline: keeps the horizon honest and gives you distance cues.
    var trees = [];
    for (var i = 0; i < 120; i++) {
      var a = (i / 120) * Math.PI * 2 + Math.random() * 0.5;
      var d = 95 + Math.random() * 150;
      trees.push([Math.cos(a) * d, Math.sin(a) * d, 0.9 + Math.random() * 1.3]);
    }
    addTreeline(trees);
    for (var h = 0; h < 7; h++) {
      var ha = Math.random() * Math.PI * 2, hd = 420 + Math.random() * 380;

        mat({ color: 0x4e5a4a, roughness: 1, flatShading: true }));

  function buildNight() {

    // Stars
    var starGeo = geo(new THREE.BufferGeometry());
    var pts = [];
    for (var s = 0; s < 1400; s++) {
      var u = Math.random() * Math.PI * 2, v = Math.random() * 0.85 + 0.05;
      var r = 900;
      pts.push(Math.cos(u) * Math.sin(v * Math.PI / 2) * r, Math.cos(v * Math.PI / 2) * r * 0.9 + 40, Math.sin(u) * Math.sin(v * Math.PI / 2) * r);
    }
    starGeo.setAttribute('position', new THREE.Float32BufferAttribute(pts, 3));
    var stars = new THREE.Points(starGeo, track(new THREE.PointsMaterial({ color: 0xdde6ff, size: 2.4, sizeAttenuation: false, transparent: true, opacity: 0.85, fog: false })));
    world.add(stars);

    var moon = new THREE.Mesh(geo(new THREE.SphereGeometry(26, 20, 16)), basic({ color: 0xdfe6f5, fog: false }));
    moon.position.set(360, 300, 500);
    world.add(moon);

    // A single light that follows the active gate, rather than one per gate.

    addPad(spec.spawn.x, spec.spawn.z);

    var neon = [0x22e0ff, 0xff3ea5, 0x9dff3c, 0xffb020, 0x6a7bff, 0xff5c16];
    COURSES.night.forEach(function (d, i) {

    // Light poles mark the field edge without lighting the ground much.
    for (var p = 0; p < 10; p++) {

      pole.position.set(px, 3.5, pz);

      head.position.set(px, 7.1, pz);
      world.add(head);

    [[12, -24, 6], [30, 2, 7], [-16, 14, 6]].forEach(function (q) { addPylon(q[0], q[1], q[2], spec.pylons); });

  /* ================= FLIGHT STATE ================= */

      camTilt = clamp(camTilt + dir * 3 * Math.PI / 180, 0, 55 * Math.PI / 180);
      parts.pod.rotation.x = camTilt;
      parts.lens.rotation.x = Math.PI / 2 + camTilt;
      toast('CAM TILT ' + Math.round(camTilt * 180 / Math.PI) + '°', '#f2ece2');
    },
    restart: function (confirmed) {
      if (inMenu() || Run.state === 'menu') return;
      if (confirmed) { hud.restartArm = 0; Run.restart(); toast('RESTART', '#ffb020'); }
      else { hud.restartArm = 2.2; Sound.warn(); }
    },
    pause: function () {
      if (Run.state === 'menu') return;
      if (pauseEl.hidden) Pause.open(); else Pause.close();
    },
    deviceChanged: function () {
      renderHint();
      if (!menuEl.hidden) Menu.render();
      if (!pauseEl.hidden) Pause.render();
    },
    isArmed: function () { return st.armed; }
  });

  /* ================= RESIZE ================= */
  function resize() {
    var w = window.innerWidth, h = window.innerHeight;
    var dpr = Math.min(window.devicePixelRatio || 1, 2);
    renderer.setSize(w, h, false);
    camera.aspect = w / h;
    camera.updateProjectionMatrix();
    hudCanvas.width = Math.floor(w * dpr);
    hudCanvas.height = Math.floor(h * dpr);
    hx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resize);
  resize();

  /* ================= LOOP ================= */
  var last = performance.now();
  var acc = 0;
  var FIXED = 1 / 240;
  var propSpin = 0;

  function frame(now) {
    requestAnimationFrame(frame);
    var dt = Math.min((now - last) / 1000, 0.1);
    last = now;

    var menuing = inMenu();
    Input.update(dt, menuing);

    if (menuing) {
      var n = Input.nav;
      if (!pauseEl.hidden) {
        if (n.up) Pause.move(-1);
        if (n.down) Pause.move(1);
        if (n.select) Pause.activate();
        if (n.back || Input.edges.pause) Pause.close();
      } else {
        if (n.up) Menu.move(0, -1);
        if (n.down) Menu.move(0, 1);
        if (n.left) Menu.move(-1, 0);
        if (n.right) Menu.move(1, 0);
        if (n.select) Menu.activate();
      }
      hx.clearRect(0, 0, window.innerWidth, window.innerHeight);
      return;
    }

    if (Input.edges.arm) Input.hooks.arm();
    if (Input.edges.resetDrone) Input.hooks.resetDrone();
    if (Input.edges.camera) cycleCamera();
    if (Input.edges.arms) Input.hooks.arms();
    if (Input.edges.pause) Pause.open();

    if (!mapSpec) return;

    acc += dt;
    var steps = 0;
    while (acc >= FIXED && steps < 64) { stepPhysics(FIXED); acc -= FIXED; steps++; }
    if (steps === 64) acc = 0;
    Run.update(dt);

    drone.position.copy(st.pos);
    drone.quaternion.copy(st.quat);

    // Props: blades below ~40% spool, a blur disc above it.
    var rpm = st.armed ? 0.35 + st.motor * 6.2 : 0;
    propSpin += rpm * dt * 9;
    var discOpacity = clamp((rpm - 1.2) / 3.2, 0, 1) * 0.2;
    parts.props.forEach(function (p, i) {
      p.hub.rotation.y = propSpin * p.dir;
      p.blades.opacity = clamp(1 - discOpacity * 2.4, 0.08, 0.95);
      parts.discs[i].material.opacity = discOpacity;
    });

    // Lights: nav lights always, strobes and beacon at night.
    var night = !!mapSpec.night;
    parts.nose.material.color.setHex(st.armed ? 0x4dff8a : 0x224433);
    parts.tail.material.color.setHex(st.armed ? 0xff3b3b : 0x441a1a);
    var strobeOn = night && st.armed && (hud.blink % 1.1) < 0.08;
    parts.strobes.forEach(function (s) { s.material.color.setHex(strobeOn ? 0xffffff : 0x202020); });
    parts.beacon.intensity = night && st.armed ? (Math.sin(hud.blink * 3) * 0.5 + 0.5) * 1.6 : 0;

    // Gate lighting: the next gate is the bright one.
    mapSpec.gates.forEach(function (g, i) {
      var isNext = i === Run.gateIndex && Run.scenario.id !== 'recover';
      if (g.style === 'neon') {
        g.glowMat.color.setHex(isNext ? 0xffffff : g.neon);
        if (isNext && mapSpec.gateLight) {
          mapSpec.gateLight.position.copy(g.centre);
          mapSpec.gateLight.color.setHex(g.neon);
        }
      } else {
        g.glowMat.color.setHex(isNext ? 0xffb020 : 0x39506e);
      }
    });

    updateCamera(dt);
    Sound.flight(st.motor, Math.min(st.omega.length() / 8, 1), st.vel.length(), st.armed);

    renderer.render(scene, camera);
    drawOSD(dt);
  }

  /* ================= BOOT ================= */
  Menu.build();
  Pause.build();
  Menu.render();
  document.getElementById('boot').hidden = true;
  menuEl.hidden = false;
  requestAnimationFrame(frame);

  window.__sim = { st: st, Run: Run, Menu: Menu, Pause: Pause, Input: Input, cfg: CFG,
    spec: function () { return mapSpec; }, cam: function () { return camMode; }, Sound: Sound };
}
</script>
</body>
</html>
