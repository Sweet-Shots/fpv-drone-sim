      st.thrCmd = thr;
    } else {
      st.climbI = 0.16;
      st.holdAlt = null;
      st.thrCmd = thr;
    }
    var airmode = Input.idleMode === 'airmode';
    // Betaflight resets the I-term at the bottom of the throttle unless air
    // mode is on, so a wound-up I cannot slam the quad when you throttle up.
    if (!airmode && thr < FC.minCheck) iTerm.set(0, 0, 0);

    var mixR = 0, mixP = 0, mixY = 0;
    if (st.armed) {
      // The FC only ever sees what the gyro reports, and the gyro clips at
      // its full scale. Past +-2000 deg/s the correction is real but blind.
      var gP = clamp(st.omega.x, -FC.gyroLimit, FC.gyroLimit);
      var gY = clamp(st.omega.y, -FC.gyroLimit, FC.gyroLimit);
      var gR = clamp(st.omega.z, -FC.gyroLimit, FC.gyroLimit);
      var eP = tp - gP, eY = ty - gY, eR = tr - gR;
      var dP = (st.omega.x - prevOmega.x) / dt;
      var dY = (st.omega.y - prevOmega.y) / dt;
      var dR = (st.omega.z - prevOmega.z) / dt;
      iTerm.x = clamp(iTerm.x + KP.pitch / FC.iTime * eP * dt, -FC.iLimit, FC.iLimit);
      iTerm.y = clamp(iTerm.y + KP.yaw   / FC.iTime * eY * dt, -FC.iLimit, FC.iLimit);
      iTerm.z = clamp(iTerm.z + KP.roll  / FC.iTime * eR * dt, -FC.iLimit, FC.iLimit);
      mixP = clamp(KP.pitch * eP - KP.pitch * FC.dTime * dP + iTerm.x, -FC.pidSumLimit, FC.pidSumLimit);
      mixY = clamp(KP.yaw   * eY - KP.yaw   * FC.dTime * dY + iTerm.y, -FC.pidSumLimitYaw, FC.pidSumLimitYaw);
      mixR = clamp(KP.roll  * eR - KP.roll  * FC.dTime * dR + iTerm.z, -FC.pidSumLimit, FC.pidSumLimit);
    } else {
      iTerm.set(0, 0, 0);
    }
    prevOmega.copy(st.omega);

    /* ---- 4. mixer, exactly as Betaflight builds it ---------------------
     *  motor = throttle + mix, mix scaled down if its span exceeds the
     *  motor range, then clipped to [motor_idle, 1]. AIR MODE (and, in the
     *  firmware, any throttle above half) shifts the whole set so the mix
     *  always fits; without it the low side sits on the idle floor, so only
     *  the upward half of each correction survives and any correction whose
     *  mix is smaller than the idle offset produces no differential thrust
     *  at all. That is the real, measurable reason authority collapses at
     *  the bottom of the stick without air mode — roughly a quarter of the
     *  mid-throttle torque, not none of it. For none of it, see MOTOR_STOP
     *  below, which is what the recovery drill actually depends on. */
    var mn = 1e9, mx = -1e9;
    for (i = 0; i < 4; i++) {
      m = MOTORS[i];
      _mix[i] = mixR * m.mixRoll + mixP * m.mixPitch + mixY * m.mixYaw;
      if (_mix[i] < mn) mn = _mix[i];
      if (_mix[i] > mx) mx = _mix[i];
    }
    var span = mx - mn;
    if (span > 1) { for (i = 0; i < 4; i++) _mix[i] /= span; mn /= span; mx /= span; }

    // FEATURE_MOTOR_STOP: stick below min_check and the motors are commanded
    // to a dead stop, whatever the PID loop would like. Nothing is turning,
    // so there is no differential thrust and no authority at all — which is
    // why a quad set up this way tumbles out of the sky the moment you chop
    // the throttle, and why the recovery drill is a drill.
    var stopped = Input.idleMode === 'motorstop' && thr < FC.minCheck;
    var base = QUAD.motorIdle + (1 - QUAD.motorIdle) * thr;
    if (airmode || thr > FC.airmodeShiftThrottle) {
      if (base + mn < QUAD.motorIdle) base = QUAD.motorIdle - mn;
      if (base + mx > 1) base = 1 - mx;
    }

    /* ---- 5. rotor spool. RPM cannot step; thrust follows RPM squared. -- */
    var mAvg = 0;
    for (i = 0; i < 4; i++) {
      var cmd = (st.armed && !stopped) ? clamp(base + _mix[i], QUAD.motorIdle, 1) : 0;
      var tau = cmd > st.motors[i] ? QUAD.spoolUpTau : QUAD.spoolDownTau;
      st.motors[i] += (cmd - st.motors[i]) * (1 - Math.exp(-dt / tau));
      mAvg += st.motors[i];
    }
    mAvg *= 0.25;
    st.motor = mAvg;

    /* ---- 6. battery. Draw is electrical, the pack's internal resistance
     *         sags it, and a sagged pack spins the motors slower, so thrust
     *         goes as (V/Vref)^2. A fresh pack really does punch harder. -- */
    var B = CFG.battery;
    var amps = B.idleAmps + B.maxAmps * Math.pow(mAvg, B.currentExp);
    st.amps = amps;
    st.mah += amps * (1000 / 3600) * dt;
    var soc = clamp(1 - st.mah / B.capacity, 0, 1);
    var rest = ocvPerCell(soc) * B.cells;
    st.volts = Math.max(B.cells * 2.8, rest - amps * B.rPack);
    var vScale = clamp((st.volts / QUAD.thrustRefV) * (st.volts / QUAD.thrustRefV), 0.4, 1.06);

    /* ---- 7. vortex ring state / propwash. Descending along your own
     *         thrust axis at roughly 1.5x the hover induced velocity puts
     *         the discs in their own wake: thrust drops and the FC is fed
     *         turbulence it cannot reject. That IS propwash. ------------- */
    var descentAx = -vAxial;
    var vrs = 0;
    if (mAvg > 0.06 && descentAx > 0) {
      var z = (descentAx - 1.5 * QUAD.inducedVelHover) / 7;
      vrs = Math.exp(-z * z) * clamp(mAvg * 2.2, 0, 1);
    }
    st.propwash = vrs;

    /* ---- 8. thrust and torque from the four rotors --------------------- */
    var ge = groundEffect(Math.max(st.pos.y, 0.02));
    var tqX = 0, tqY = 0, tqZ = 0, Tsum = 0;
    for (i = 0; i < 4; i++) {
      var mi = st.motors[i];
      var Ti = 0;
      if (mi > 1e-4) {
        Ti = QUAD.thrustPerMotorN * Math.pow(mi, QUAD.thrustExp) * vScale * ge;
        // Axial inflow unloads the disc; thrust dies as the airspeed
        // through it approaches the prop's geometric pitch speed. This is
        // what actually caps top speed and climb rate on a real quad.
        var vp = QUAD.pitchSpeedMax * Math.pow(mi, QUAD.thrustExp / 2);
        if (vp > 1) Ti *= clamp(1 - vAxial / vp, 0, 1.15);
        Ti *= 1 - 0.22 * vrs;
      }
      Tsum += Ti;
      m = MOTORS[i];
      tqX += -m.z * Ti;
      tqZ += m.x * Ti;
      tqY += m.mixYaw * Ti * QUAD.propTorqueArm;
    }
    st.thrustN = Tsum;

    // Aerodynamic damping of body rotation: the airframe, plus a much
    // larger term from the spinning discs (an advancing blade sees more
    // inflow than a retreating one).
    var dampC = QUAD.rotDampBody + QUAD.rotDampProp * mAvg;
    tqX -= dampC * st.omega.x;
    tqY -= dampC * 1.6 * st.omega.y;     // yaw damps hardest: biggest lever on the discs
    tqZ -= dampC * st.omega.z;

    // TURTLE MODE (AUX): props reverse so an upside-down quad can flip itself
    // back onto its feet without a walk of shame.
    if (Input.turtleHeld && !mode.hold && st.armed && st.pos.y < CFG.groundY + 0.06) {
      _right.set(1, 0, 0).applyQuaternion(st.quat);
      _up.set(0, 1, 0).applyQuaternion(st.quat);
      if (_up.y < 0.5) {
        tqZ -= 0.075 * (_right.y > 0 ? 1 : -1);
        st.turtling = 1;
      } else { st.turtling = 0; }
    } else { st.turtling = 0; }

    if (vrs > 0.01) {
      pwPhase += dt * 47;
      var pw = vrs * QUAD.propwashTorque;
      tqX += Math.sin(pwPhase * 1.37) * pw;
      tqZ += Math.sin(pwPhase * 0.91 + 1.7) * pw;
    }

    /* ---- 9. rigid-body rotation, including the Euler (gyroscopic) term
     *         that couples a simultaneous roll and pitch into yaw. ------- */
    var wx = st.omega.x, wy = st.omega.y, wz = st.omega.z;
    var gx = wy * (QUAD.Iroll * wz) - wz * (QUAD.Iyaw * wy);
    var gy = wz * (QUAD.Ipitch * wx) - wx * (QUAD.Iroll * wz);
    var gz = wx * (QUAD.Iyaw * wy) - wy * (QUAD.Ipitch * wx);
    st.omega.x += (tqX - gx) / QUAD.Ipitch * dt;
    st.omega.y += (tqY - gy) / QUAD.Iyaw * dt;
    st.omega.z += (tqZ - gz) / QUAD.Iroll * dt;

    var mag = st.omega.length();
    if (mag > 1e-7) {
      _axis.copy(st.omega).divideScalar(mag);
      _dq.setFromAxisAngle(_axis, mag * dt);
      st.quat.multiply(_dq).normalize();
    }

    /* ---- 10. forces: thrust along body up, gravity, anisotropic drag.
     *          A quad is a bluff body belly-on (four prop discs and a
     *          plate) and far cleaner nose-on, which is why a nose-down
     *          dive runs away and a flat-out level run does not. ------- */
    _up.set(0, 1, 0).applyQuaternion(st.quat);
    var acc = _v.copy(_up).multiplyScalar(Tsum / QUAD.massKg);
    acc.y -= QUAD.gravity;

    var q = 0.5 * QUAD.rho;
    _drag.set(-q * QUAD.cdaLateral * Math.abs(_airB.x) * _airB.x,
              -q * QUAD.cdaAxial   * Math.abs(_airB.y) * _airB.y,
              -q * QUAD.cdaLong    * Math.abs(_airB.z) * _airB.z);
    _drag.applyQuaternion(st.quat);
    acc.addScaledVector(_drag, 1 / QUAD.massKg);

    st.vel.addScaledVector(acc, dt);
    st.pos.addScaledVector(st.vel, dt);

    collide(dt);
    if (Run.state === 'live' || Run.state === 'countdown') st.flightTime += dt;
  }

  /* Resting cell voltage against state of charge. A Li-Po is flat across
   * the middle of the pack and falls off a cliff at the end; a straight
   * line from 4.2 to 3.4 would make the last third of the flight feel
   * like the first. Five points, linearly interpolated. */
  var OCV = [[0, 3.20], [0.1, 3.55], [0.2, 3.68], [0.4, 3.79],
             [0.6, 3.86], [0.8, 3.95], [1, 4.20]];
  function ocvPerCell(soc) {
    for (var i = 1; i < OCV.length; i++) {
      if (soc <= OCV[i][0]) {
        var a = OCV[i - 1], b = OCV[i];
        return a[1] + (b[1] - a[1]) * (soc - a[0]) / (b[0] - a[0]);
      }
    }
    return OCV[OCV.length - 1][1];
  }

  function crash(impact) {
    st.crashes++;
    Sound.crash(impact);
    if (impact > CFG.crashSpeed && st.armed) {
      st.armed = false;
      Sound.disarm();
      toast('CRASHED', '#ff4d4d');
      Run.onCrash(impact);
    } else if (impact > 3) {
      Run.onCrash(impact);
    }
  }

  function collide(dt) {
    // Ground
    if (st.pos.y < CFG.groundY) {
      var impact = -st.vel.y;
      st.pos.y = CFG.groundY;
      if (st.vel.y < 0) {
        if (impact > 1.2) crash(impact);
        st.vel.y = -st.vel.y * CFG.bounce;
        if (Math.abs(st.vel.y) < 0.4) st.vel.y = 0;
      }
      // Coulomb friction, not a per-step multiplier: mu * g * dt taken off
      // the horizontal speed, so the result does not depend on the tick rate.
      var hs = Math.hypot(st.vel.x, st.vel.z);
      if (hs > 1e-4) {
        var drop = CFG.frictionMu * QUAD.gravity * dt;
        var k = drop >= hs ? 0 : (hs - drop) / hs;
        st.vel.x *= k;
        st.vel.z *= k;
      }
      if (!st.armed) {
        // Landed and disarmed: props stopped, the frame settles on its feet.
        st.omega.multiplyScalar(Math.exp(-4.5 * dt));
        _dq.setFromEuler(new THREE.Euler(0, yawOf(st.quat), 0));
        st.quat.slerp(_dq, Math.min(1, dt * 4));
      }
      Run.onGround();
    }

    // Ceiling and walls (indoor maps)
    if (mapSpec.ceiling && st.pos.y > mapSpec.ceiling) {
      st.pos.y = mapSpec.ceiling;
      if (st.vel.y > 0) { crash(st.vel.y); st.vel.y *= -CFG.bounce; }
    }
    if (mapSpec.bounds) {
      ['x', 'z'].forEach(function (axis) {
        var lim = mapSpec.bounds[axis];
        if (st.pos[axis] > lim) { st.pos[axis] = lim; if (st.vel[axis] > 0) { crash(st.vel[axis]); st.vel[axis] *= -CFG.bounce; } }
        else if (st.pos[axis] < -lim) { st.pos[axis] = -lim; if (st.vel[axis] < 0) { crash(-st.vel[axis]); st.vel[axis] *= -CFG.bounce; } }
      });
    }

    // Obstacles
    var ob = mapSpec.pylons;
    for (var i = 0; i < ob.length; i++) {
      var p = ob[i];
      if (st.pos.y > p.h + 0.2) continue;
      var dx = st.pos.x - p.x, dz = st.pos.z - p.z;
      var d = Math.hypot(dx, dz);
      var minD = p.r + 0.22;
      if (d < minD && d > 1e-4) {
        var nx = dx / d, nz = dz / d;
        st.pos.x = p.x + nx * minD;
        st.pos.z = p.z + nz * minD;
        var vn = st.vel.x * nx + st.vel.z * nz;
        if (vn < 0) {
          st.vel.x -= (1 + CFG.bounce) * vn * nx;
          st.vel.z -= (1 + CFG.bounce) * vn * nz;
          crash(-vn);
        }
      }
    }

    checkGates();
  }

  var _rel = new THREE.Vector3();
  function checkGates() {
    var gates = mapSpec.gates;
    for (var i = 0; i < gates.length; i++) {
      var g = gates[i];
      _rel.copy(st.pos).sub(g.centre);
      var side = _rel.dot(g.normal);
      var radial = Math.sqrt(Math.max(0, _rel.lengthSq() - side * side));

      if (Math.abs(side) < 0.4 && Math.abs(radial - g.radius) < 0.4) {
        crash(st.vel.length());
        var push = _v.copy(_rel).addScaledVector(g.normal, -side);
        if (push.lengthSq() > 1e-6) {
          push.normalize().multiplyScalar(radial > g.radius ? 0.35 : -0.35);
          st.pos.add(push);
          st.vel.multiplyScalar(0.4);
        }
      }
      if (g.prevSide !== 0 && radial < g.radius - 0.25 && g.prevSide < 0 && side >= 0) Run.onGate(i);
      g.prevSide = side < 0 ? -1 : 1;
    }
  }

  /* ================= RUN / SCENARIOS ================= */
  var Run = {
    scenario: SCENARIOS[1], map: MAPS[0],
    state: 'menu',            // menu | countdown | live | done
    t: 0, countdown: 0,
    gateIndex: 0, lap: 0, lapStart: null, lastLap: null, bestLap: null,
    splits: [], bestSplits: null, delta: null,
    score: 0, timeLeft: 0,
    rec: { round: 0, stable: 0, alt: 0 },
    result: null, banner: null,

    begin: function (scenario, map) {
      this.scenario = scenario;
      this.map = map;
      if (!mapSpec || mapSpec.id !== map.id) {
        clearWorld();
        mapSpec = BUILDERS[map.id]();
        mapSpec.id = map.id;
      }
      Store.data.map = map.id;
      Store.data.scenario = scenario.id;
      Store.save();
      this.restart();
    },

    restart: function () {
      var s = this.scenario;
      this.t = 0;
      this.gateIndex = 0;
      this.lap = 0;
      this.lapStart = null;
      this.lastLap = null;
      this.bestLap = null;
      this.splits = [];
      this.delta = null;
      this.score = 0;
      this.result = null;
      this.banner = null;
      this.rec.round = 0;
      this.rec.stable = 0;
      st.flightTime = 0;
      st.crashes = 0;
      resetBattery();
      // Start every run at idle. A gamepad re-reads its physical stick on the
      // next frame; the keyboard's virtual throttle has to be put down by hand.
      Input._thr = 0;
      Input.ctl.throttle = 0;
      mapSpec.gates.forEach(function (g) { g.prevSide = 0; });

      camMode = s.camera;
      applyFov();

      if (s.id === 'recover') {
        this.state = 'live';
        st.armed = true;
        this.spawnTumble();
      } else if (s.id === 'free') {
        this.state = 'live';
        placeAtSpawn();
        st.armed = false;
      } else {
        this.state = 'countdown';
        this.countdown = 3.999;
        placeAtSpawn();
        st.armed = false;
        this.timeLeft = s.seconds || 0;
      }
      Sound.startFlight();
      hud.pulse = 0;
      // Ghosts are per course, airframe and mode: a whoop lap and a 7" lap
      // are not the same race.
      Ghost.load();
      if (s.id === 'race' || s.id === 'los') Ghost.startLap(); else Ghost.stop();
    },

    // Recovery drill: thrown into the air inverted and spinning, harder each round.
    spawnTumble: function () {
      var r = this.rec.round;
      var alt = Math.max(14, 42 - r * 3);
      this.rec.alt = alt;
      this.rec.stable = 0;
      st.pos.set(mapSpec.spawn.x + (Math.random() - 0.5) * 14, alt, mapSpec.spawn.z + (Math.random() - 0.5) * 14);
      st.vel.set((Math.random() - 0.5) * 6, -4 - Math.random() * 5, (Math.random() - 0.5) * 6);
      // Inverted, not merely random. Air mode will stop the spin for you but
      // it never levels you, so the drill is: read the attitude, roll upright,
      // and only then add throttle — power applied upside down flies you down.
      st.quat.setFromEuler(new THREE.Euler(
        (Math.random() - 0.5) * 1.0,
        Math.random() * Math.PI * 2,
        Math.PI + (Math.random() - 0.5) * 1.2, 'YXZ'));
      // A real tumble about a random axis — per-axis noise can cancel out and
      // hand you a gentle spawn that teaches nothing.
      var spin = (3.4 + r * 1.2) * (0.85 + Math.random() * 0.3);
      var axis = new THREE.Vector3(Math.random() - 0.5, (Math.random() - 0.5) * 0.5, Math.random() - 0.5);
      if (axis.lengthSq() < 1e-6) axis.set(0, 0, 1);
      st.omega.copy(axis.normalize()).multiplyScalar(spin);
      zeroMotors();
      st.armed = true;
      chaseInit = false;
      toast('ROUND ' + (r + 1), '#ffb020');
    },

    update: function (dt) {
      if (this.state === 'countdown') {
        var was = Math.ceil(this.countdown);
        this.countdown -= dt;
        var now = Math.ceil(this.countdown);
        if (now !== was && now >= 0) Sound.count(now === 0);
        if (this.countdown <= 0) {
          this.state = 'live';
          this.t = 0;
          st.armed = true;
          Sound.arm();
          toast('GO', '#7dffb0');
        }
        return;
      }
      if (this.state !== 'live') return;
      this.t += dt;

      if (this.scenario.id === 'rush') {
        this.timeLeft -= dt;
        if (this.timeLeft <= 4 && Math.floor(this.timeLeft) !== Math.floor(this.timeLeft + dt)) Sound.warn();
        if (this.timeLeft <= 0) {
          this.timeLeft = 0;
          this.finish('TIME', this.score + ' gate' + (this.score === 1 ? '' : 's'), this.score, false);
        }
      }

      if (this.scenario.id === 'recover') {
        _up.set(0, 1, 0).applyQuaternion(st.quat);
        var level = _up.y > 0.88;
        var slow = st.omega.length() < 0.7;
        var sink = st.vel.y > -3.5;
        var high = st.pos.y > 4;
        if (level && slow && sink && high) {
          this.rec.stable += dt;
          if (this.rec.stable >= 1.2) {
            this.rec.round++;
            Sound.win();
            toast('RECOVERED', '#7dffb0');
            this.spawnTumble();
          }
        } else {
          this.rec.stable = 0;
        }
      }

      // Flat battery is the end of the flight, whatever the mode.
      if (st.volts / CFG.battery.cells < 3.3) {
        st.armed = false;
        this.finish('PACK EMPTY', 'Flight time ' + fmtTime(st.flightTime), null, false);
      }
    },

    onGate: function (i) {
      if (this.state !== 'live') return;
      var s = this.scenario;
      if (s.id === 'free') { if (i === this.gateIndex) { Sound.gate(); this.gateIndex = (i + 1) % mapSpec.gates.length; } return; }
      if (s.id === 'recover') return;
      if (i !== this.gateIndex) return;

      Sound.gate();
      hud.pulse = 1;

      if (s.id === 'rush') {
        this.score++;
        this.timeLeft += s.bonus;
        toast('+' + s.bonus + 'S', '#7dffb0');
        // Next target is any gate but this one — keeps you moving.
        var n = mapSpec.gates.length;
        var next = (i + 1 + ((Math.random() * (n - 1)) | 0)) % n;
        this.gateIndex = next;
        return;
      }

      // Time trial / LOS: sequential gates, laps, splits.
      var laps = s.laps || 2;
      this.splits.push(this.t);
      if (this.lapStart === null) { this.lapStart = this.t; Ghost.startLap(); }
      else Ghost.onSplit(this.splits.length - 2, this.t - this.lapStart);
      var n2 = mapSpec.gates.length;
      this.gateIndex = (i + 1) % n2;

      if (this.gateIndex === 0) {
        var lapTime = this.t - this.lapStart;
        this.lapStart = this.t;
        this.lastLap = lapTime;
        var storedBest = Store.record(this.map.id + '.' + AF.id, this.scenario.id);
        var isBest = storedBest === undefined || lapTime < storedBest;
        Ghost.finishLap(lapTime, isBest);
        if (this.bestLap === null || lapTime < this.bestLap) this.bestLap = lapTime;
        this.lap++;
        if (this.lap >= laps) {
          this.finish('FINISH', 'Total ' + fmtTime(this.t) + '  ·  Best lap ' + fmtTime(this.bestLap), this.bestLap, true);
        } else {
          toast('LAP ' + this.lap + '  ' + fmtTime(lapTime), '#ffb020');
        }
      }
    },

    onCrash: function () {
      if (this.state !== 'live') return;
      if (this.scenario.id === 'recover') {
        this.finish('DOWN', 'Recovered ' + this.rec.round + ' round' + (this.rec.round === 1 ? '' : 's'), this.rec.round, false);
      }
    },

    onGround: function () {
      if (this.state === 'live' && this.scenario.id === 'recover' && this.rec.round >= 0 && st.pos.y <= CFG.groundY + 0.01) {
        this.finish('DOWN', 'Recovered ' + this.rec.round + ' round' + (this.rec.round === 1 ? '' : 's'), this.rec.round, false);
      }
    },

    finish: function (title, sub, value, lowerBetter) {
      if (this.state === 'done') return;
      this.state = 'done';
      st.armed = false;
      Ghost.stop();
      var best = false;
      if (value !== null && value !== undefined) {
        best = Store.setRecord(this.map.id + '.' + AF.id, this.scenario.id, value, lowerBetter);
      }
      this.result = { title: title, sub: sub, best: best };
      if (best) Sound.win(); else Sound.fail();
      toast(title, title === 'FINISH' ? '#7dffb0' : '#ffb020');
    },

  var PAGES = {

  var Menu = {
    page: 'main',
    focus: 0,
    idxSession: 0,

    sessions: function () {

    },
    scenario: function () { var l = this.sessions(); return l[Math.min(this.idxSession, l.length - 1)]; },
    mapSel: function () { return MAPS[this.idxMap]; },
    clampSession: function () {
      var l = this.sessions();
      if (this.idxSession >= l.length) this.idxSession = l.length - 1;
    },
    stepList: function (list, key, d) {
      var n = list.length;
      this[key] = (this[key] + d + n) % n;
    },
    rows: function () { return (PAGES[this.page].rows || []).map(function (id) { return ROWS[id]; }); },
    isContent: function () { return !!PAGES[this.page].content; },

    build: function () {
      var self = this;
      var dial = document.getElementById('dial');
      // One button per row id; pages show and hide them.
      Object.keys(ROWS).forEach(function (id) {
        var row = ROWS[id];

          var rows = self.rows();
          var i = rows.indexOf(row);
          if (i < 0) return;
          if (self.focus === i) self.activate();
          else { self.focus = i; Sound.move(); self.render(); }
        });
        dial.appendChild(b);
        row.el = b;
      });

      var rp = RATE_PROFILES.filter(function (x) { return x.id === Store.data.rates; })[0];
      if (rp) Input.profile = rp;
      Input.mode = flightModeById(Store.data.flightMode);

      GFX = gfxById(Store.data.gfx);

      if (mi >= 0) this.idxMap = mi;

    go: function (page) {

    },

    /* Rows are spaced evenly and pushed right by the half-ellipse they sit on.
     * The ellipse is sized from the dial box, never from the row count, so the
     * arc is exactly the same circle on every page and at every selection. */
    layout: function () {
      var dial = document.getElementById('dial');
      var h = dial.clientHeight || 420;
      var w = dial.clientWidth || 420;
      // The arc is sized from the VIEWPORT, never from the dial box. Anything
      // measured from siblings — a record that only exists on one page, a
      // description of a different length, a font that swaps in late — makes
      // the circle breathe as you move through it.
      var Ry = clamp(window.innerHeight * 0.30, 150, 300);
      var Rx = clamp(window.innerHeight * 0.135, 68, 104);
      var cx = 18;
      var cy = h / 2;
      var rows = this.rows();
      var n = rows.length;
      var rowH = n ? clamp((2 * Ry - 44) / Math.max(n, 4), 26, 46) : 40;
      var self = this;

      Object.keys(ROWS).forEach(function (id) { ROWS[id].el.hidden = true; });
      rows.forEach(function (row, i) {
        var el = row.el;
        el.hidden = false;
        var dy = (i - (n - 1) / 2) * rowH;
        var k = clamp(dy / Ry, -1, 1);
        var x = cx + Rx * Math.sqrt(Math.max(0, 1 - k * k));
        el.style.transform = 'translate(' + x.toFixed(1) + 'px,' + (cy + dy - rowH / 2).toFixed(1) + 'px)';
        el.style.opacity = (i === self.focus ? 1 : 0.72 - Math.abs(k) * 0.18).toFixed(3);
        el.setAttribute('data-focus', i === self.focus ? '1' : '0');
        el.querySelector('.lbl').textContent = row.label || '';
        el.querySelector('.val').textContent = row.value();
      });

      var p1 = [];
      for (var t = -1; t <= 1.0001; t += 0.04) {
        p1.push((cx + Rx * Math.sqrt(Math.max(0, 1 - t * t))).toFixed(1) + ',' + (cy + t * Ry).toFixed(1));
      }
      var p2 = [];
      if (n) {
        var fk = clamp(((this.focus - (n - 1) / 2) * rowH) / Ry, -1, 1);
        for (var u = fk - 0.075; u <= fk + 0.075; u += 0.015) {
          var uu = clamp(u, -1, 1);
          p2.push((cx + Rx * Math.sqrt(Math.max(0, 1 - uu * uu))).toFixed(1) + ',' + (cy + uu * Ry).toFixed(1));
        }
      }
      var svg = dial.querySelector('.dial-arc');
      svg.setAttribute('viewBox', '0 0 ' + w + ' ' + h);
      document.getElementById('arcpath').setAttribute('d', 'M' + p1.join(' L'));
      document.getElementById('arcpath2').setAttribute('d', p2.length ? 'M' + p2.join(' L') : '');
    },

    renderContent: function () {
      var box = document.getElementById('pagecontent');
      var kind = PAGES[this.page].content;
      if (!kind) { box.hidden = true; return; }
      box.hidden = false;
      if (kind === 'help') {
        var col = function (title, list) {
          return '<div class="helpcol"><h3>' + title + '</h3><dl>' + list.map(function (b) {
            return '<dt>' + b[0] + '</dt><dd>' + b[1] + '</dd>';
          }).join('') + '</dl></div>';
        };
        box.innerHTML = '<div class="helpgrid">' +
          col('Keyboard', HELP_KEYBOARD) + col('Gamepad', HELP_GAMEPAD) +
          '<p class="helpnote">Both work at once and neither is required — a gamepad takes over the moment ' +
          'you move a stick, and the keyboard takes it straight back. Flying uses only the two sticks; the ' +
          'shoulder buttons are AUX switches, exactly as on a real transmitter.</p></div>';
      } else {
        box.innerHTML = '<div class="credits">' +
          '<p class="ctag">Made by</p>' +
          '<p class="cname">Douglas Harvey</p>' +
          '<p class="cfor">for <b>Drone Club</b></p>' +
          '<div class="crule"></div>' +
          '<p class="clove">Made with love</p></div>';
      }
    },

    render: function () {
      this.clampSession();
      var content = this.isContent();

      // Update everything that can affect layout FIRST, then measure. The
      // title keeps its space even when empty; a header that changes height
      // moves the dial, and a dial that moves resizes the arc.
      var pt = document.getElementById('m-page');
      pt.textContent = PAGES[this.page].title || '\u00a0';
      pt.style.visibility = PAGES[this.page].title ? 'visible' : 'hidden';
      this.renderContent();
      this.layout();

      var rows = this.rows();
      var brief = content
        ? (this.page === 'help' ? 'Press Enter or Esc to go back.' : 'Press Enter or Esc to go back.')
        : (rows[this.focus] ? rows[this.focus].brief() : '');
      document.getElementById('briefdesc').innerHTML = brief;

      document.getElementById('m-meta').innerHTML =
        AF.name.toUpperCase() + ' &middot; <b>' + Input.profile.name.toUpperCase() + '</b> RATES &middot; ' +
        CFG.battery.cells + 'S ' + CFG.battery.capacity +
        (Input.mode.selfLevel ? ' &middot; SELF-LEVELLING' : ' &middot; NO SELF-LEVEL');

      // The record only means something once a session and place are picked.
      var box = document.getElementById('briefrecord');
      if (this.page === 'play') {
        var sc = this.scenario(), mp = this.mapSel();
        var rec = Store.record(mp.id + '.' + AF.id, sc.id);
        var label = sc.id === 'rush' ? 'Most gates' : sc.id === 'recover' ? 'Best rounds' : sc.id === 'free' ? '' : 'Best lap';
        box.innerHTML = !label ? '' : label + '<span class="t"' + (rec === undefined ? ' style="color:var(--ink-faint)"' : '') + '>' +
          (rec === undefined ? 'not set' : (sc.id === 'rush' || sc.id === 'recover' ? rec : fmtTime(rec))) + '</span>';
      } else {
        box.innerHTML = '';
      }

      document.getElementById('menubinds').innerHTML = Input.bindings('menu').map(function (b) {
        return '<span><b>' + b[0] + '</b>' + b[1] + '</span>';
      }).join('');
      var dev = document.getElementById('devbadge');
      dev.classList.toggle('pad', Input.active === 'gamepad');
      dev.classList.toggle('touch', Input.active === 'touch');
      dev.querySelector('b').textContent = Input.active === 'touch' ? 'Touch' : Input.active === 'gamepad'
        ? (Input.padName ? Input.padName.replace(/\s*\(.*\)\s*/, '').slice(0, 24) || 'Gamepad' : 'Gamepad')
        : 'Keyboard';
    },

    move: function (dx, dy) {
      if (this.isContent()) { if (dx || dy) return; }
      var rows = this.rows();
      if (dy) {
        this.focus = clamp(this.focus + dy, 0, rows.length - 1);
        Sound.move();
      } else if (dx && rows[this.focus] && rows[this.focus].step) {
        rows[this.focus].step(dx);
        Sound.select();
      }
      this.render();
    },

    activate: function () {
      if (this.isContent()) { this.go('main'); return; }
      var row = this.rows()[this.focus];
      if (!row) return;
      if (row.isAction) row.action();
      else { row.step(1); Sound.select(); this.render(); }
    },

    back: function () {
      if (this.page === 'main') return false;
      this.go('main');
      return true;
    },

    launch: function () {
      Sound.unlock();
      Sound.select();
      Demo.stop();
      menuEl.hidden = true;
      camera.clearViewOffset();
      Run.begin(this.scenario(), this.mapSel());
      renderHint();
    },

    show: function () {
      menuEl.hidden = false;
      pauseEl.hidden = true;
      Run.state = 'menu';
      Sound.stopFlight();
      this.page = 'main';
      this.focus = 0;
      this.render();
      var self = this;
      requestAnimationFrame(function () { self.layout(); });
      Demo.start();
    }
  };

  /* ================= PAUSE ================= */
  var PAUSE_ROWS = [

  var Pause = {
    idx: 0, els: [],
    build: function () {

  };

  function inMenu() { return !menuEl.hidden || !pauseEl.hidden; }

  /* ================= INPUT HOOKS ================= */
  Input.init({
    screenKey: function (code) {
      if (!pauseEl.hidden) {
        if (code === 'ArrowUp' || code === 'KeyW') { Pause.move(-1); return true; }
        if (code === 'ArrowDown' || code === 'KeyS') { Pause.move(1); return true; }
        if (code === 'Enter' || code === 'Space') { Pause.activate(); return true; }
        if (code === 'Escape' || code === 'KeyP') { Pause.close(); return true; }
        return true;
      }
      if (!menuEl.hidden) {
        if (code === 'ArrowUp' || code === 'KeyW') { Menu.move(0, -1); return true; }
        if (code === 'ArrowDown' || code === 'KeyS') { Menu.move(0, 1); return true; }
        if (code === 'ArrowLeft' || code === 'KeyA') { Menu.move(-1, 0); return true; }
        if (code === 'ArrowRight' || code === 'KeyD') { Menu.move(1, 0); return true; }
        if (code === 'Enter' || code === 'Space') { Menu.activate(); return true; }
        if (code === 'Escape' || code === 'Backspace') { if (!Menu.back()) Sound.back(); return true; }
        return true;
      }
      return false;
    },
    arm: function () {
      if (Run.state === 'countdown') return;
      if (!st.armed) {
        // In camera mode the throttle gimbal is a climb command about its
        // centre, so "stick down" is the wrong check — centred is.
        var stickHot = Input.mode.hold ? Math.abs(Input.ctl.climb) > 0.15 : Input.ctl.throttle > 0.12;
        if (stickHot) { toast(Input.mode.hold ? 'CENTRE THE THROTTLE TO ARM' : 'LOWER THROTTLE TO ARM', '#ffb020'); Sound.warn(); return; }
        if (Input.mode.hold) { st.holdAlt = null; st.climbI = 0.16; }
        st.armed = true; Sound.arm(); toast('ARMED', '#ff4d4d');
      } else {
        st.armed = false; Sound.disarm(); toast('DISARMED', '#f2ece2');
      }
    },
    resetDrone: function () {
      if (Run.scenario.id === 'recover' && Run.state === 'live') { Run.spawnTumble(); return; }
      placeAtSpawn();
      toast('RESET', '#f2ece2');
    },
    camera: cycleCamera,
    arms: function () {

  requestAnimationFrame(frame);

  window.__cam = camera;
  window.__touch = Touch;
  window.__sim = { st: st, Run: Run, Menu: Menu, Pause: Pause, Input: Input, cfg: CFG, Demo: Demo,
    gfx: function () { return GFX; }, modes: FLIGHT_MODES,
    spec: function () { return mapSpec; }, cam: function () { return camMode; }, Sound: Sound,
    // Exposed so the flight model can be measured rather than taken on trust.
    tilt: function () { return Input.mode.hold ? gimbalTilt : camTilt; },
    Ghost: Ghost, airframes: AIRFRAMES, af: function () { return AF; },
    applyAirframe: applyAirframe,
    quad: QUAD, fc: FC, motors: MOTORS, kp: KP, profiles: RATE_PROFILES, bfRate: bfRate,
    step: function (dt) { stepPhysics(dt); }, zeroFC: zeroMotors };
}
</script>
